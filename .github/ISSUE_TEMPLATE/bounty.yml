name: Bounty
about: Proponi o reclama un bounty per una ricompensa in $MYZ
title: '[BOUNTY] <titolo breve>'
labels: ['bounty']
assignees: ''
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Descrizione
        <!-- Descrizione chiara del lavoro richiesto -->

  - type: textarea
    id: description
    attributes:
      label: Descrizione dettagliata
      description: Spiega cosa deve essere fatto
      placeholder: Implementare feature X...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: Lista verificabile di requisiti
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
        - [ ] Criterio 3
    validations:
      required: true

  - type: input
    id: reward
    attributes:
      label: Importo ricompensa (MYZ)
      placeholder: '80'
    validations:
      required: true

  - type: dropdown
    id: rail
    attributes:
      label: Rail di pagamento
      options:
        - Tari
        - Altro (specificare)
    validations:
      required: true

  - type: dropdown
    id: funding_state
    attributes:
      label: Stato finanziamento
      description: Indica se i fondi sono già disponibili
      options:
        - funded
        - unfunded
        - proposed
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Metodo di verifica
      description: Come viene verificato il completamento
      placeholder: Review del codice + test passanti
    validations:
      required: true

  - type: textarea
    id: settlement
    attributes:
      label: Condizioni di settlement
      description: Condizioni per il settlement esterno (richiede evidenza indipendente)
      placeholder: Fondi disponibili su wallet gateway + conferma on-chain
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## 📚 Riferimenti
        - Regole complete: [BOUNTIES.md](https://github.com/MyZubster-Ecosystem/myzubster/blob/main/BOUNTIES.md)
        - Registro ricompense: [REWARDS_LEDGER.md](https://github.com/MyZubster-Ecosystem/myzubster/blob/main/REWARDS_LEDGER.md)

        > **Nota:** Il merge della PR o la chiusura dell'issue non costituiscono prova di pagamento. La ricompensa segue il flusso: VERIFIED → REWARD_RECORDED → SETTLEMENT_PENDING/SETTLED (con evidenza indipendente).
