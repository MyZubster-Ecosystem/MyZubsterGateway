name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required production secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/myzubster-gateway
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart gateway

      - name: Check deployed Gateway service
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          sleep 10
          for endpoint in /api/health /api/status; do
            echo "Checking ${APP_URL%/}${endpoint}"
            curl --fail --silent --show-error --max-time 15 "${APP_URL%/}${endpoint}" >/dev/null
          done

      - name: Check public Zargox API
        env:
          ZARGOX_URL: https://myzubster-gateway.vercel.app/api/zargox
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl -L -sS --max-time 15 -o "$response_file" -w '%{http_code}' "$ZARGOX_URL" || true)
          echo "Zargox endpoint: $ZARGOX_URL"
          echo "HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "::error::Zargox public API returned HTTP $http_code"
            head -c 1000 "$response_file" || true
            exit 1
          fi
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$response_file" || {
            echo "::error::Zargox response does not report ok=true"
            head -c 1000 "$response_file" || true
            exit 1
          }
          grep -Eq '"configured"[[:space:]]*:[[:space:]]*true' "$response_file" || {
            echo "::error::Zargox provider is not configured"
            head -c 1000 "$response_file" || true
            exit 1
          }

      - name: Notify on success
        if: ${{ success() && env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Deploy successful: MyZubster Gateway production"
            }

      - name: Slack not configured
        if: ${{ success() && env.SLACK_WEBHOOK == '' }}
        run: echo "Slack notification skipped because SLACK_WEBHOOK is not configured."

  rollback:
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Validate rollback configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required rollback secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/myzubster-gateway
            git reset --hard HEAD~1
            npm ci --omit=dev
            pm2 restart gateway

      - name: Notify rollback
        if: ${{ env.SLACK_WEBHOOK != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Deploy FAILED — rollback executed on MyZubster Gateway"
            }

      - name: Slack rollback notification skipped
        if: ${{ env.SLACK_WEBHOOK == '' }}
        run: echo "Slack rollback notification skipped because SLACK_WEBHOOK is not configured."
