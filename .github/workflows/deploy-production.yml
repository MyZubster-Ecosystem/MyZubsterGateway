name: Production Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_vps:
        description: 'Also deploy to the optional VPS target'
        required: true
        default: false
        type: boolean

jobs:
  validate-hosted-production:
    name: Validate hosted production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build --if-present

      - name: Check public Zargox API
        env:
          ZARGOX_URL: https://myzubster-gateway.vercel.app/api/zargox
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          http_code=$(curl -L -sS --max-time 20 -o "$response_file" -w '%{http_code}' "$ZARGOX_URL" || true)
          echo "Zargox endpoint: $ZARGOX_URL"
          echo "HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "::error::Zargox public API returned HTTP $http_code"
            head -c 1000 "$response_file" || true
            exit 1
          fi
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$response_file" || {
            echo "::error::Zargox response does not report ok=true"
            head -c 1000 "$response_file" || true
            exit 1
          }
          grep -Eq '"configured"[[:space:]]*:[[:space:]]*true' "$response_file" || {
            echo "::error::Zargox provider is not configured"
            head -c 1000 "$response_file" || true
            exit 1
          }

      - name: Check optional hosted Gateway URL
        if: ${{ env.APP_URL != '' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          for endpoint in /api/health /api/status; do
            url="${APP_URL%/}${endpoint}"
            echo "Checking $url"
            curl --fail --silent --show-error --max-time 20 "$url" >/dev/null
          done

      - name: Hosted Gateway URL not configured
        if: ${{ env.APP_URL == '' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: echo "APP_URL is not configured; skipping the optional hosted Gateway health check."

  deploy-vps:
    name: Deploy optional VPS
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_vps == true }}
    needs: validate-hosted-production
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate VPS configuration
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY APP_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required VPS secret: ${name}"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/myzubster-gateway
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart gateway

      - name: Verify VPS deployment
        run: |
          set -euo pipefail
          sleep 10
          for endpoint in /api/health /api/status; do
            url="${APP_URL%/}${endpoint}"
            echo "Checking $url"
            curl --fail --silent --show-error --max-time 20 "$url" >/dev/null
          done

  rollback-vps:
    name: Roll back optional VPS
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.deploy_vps == true && needs.deploy-vps.result == 'failure' }}
    needs: deploy-vps
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Validate rollback configuration
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required VPS rollback secret: ${name}"
              exit 1
            fi
          done

      - name: Roll back VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/myzubster-gateway
            git reset --hard HEAD~1
            npm ci --omit=dev
            pm2 restart gateway
