name: Production Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Health check OK: HTTP $HTTP_CODE"
      
      - name: Check API Endpoints
        run: |
          for endpoint in "/api/health" "/api/status"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.APP_URL }}$endpoint)
            echo "$endpoint: HTTP $CODE"
          done
      
      - name: Alert on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚨 Health Check FAILED for MyZubster Gateway!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
