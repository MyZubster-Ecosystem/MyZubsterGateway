name: Production Health Check

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

env:
  CURL_TIMEOUT: 15
  APP_URL: https://myzubster-gateway.vercel.app

jobs:
  health-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check Zargox API health
        run: |
          set -euo pipefail
          HEALTH_URL="${APP_URL%/}/api/zargox"
          HTTP_CODE=$(curl -L -sS --max-time "$CURL_TIMEOUT" -o /tmp/health-response -w "%{http_code}" "$HEALTH_URL" || true)
          echo "Health endpoint: $HEALTH_URL"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check FAILED with HTTP $HTTP_CODE"
            head -c 1000 /tmp/health-response 2>/dev/null || true
            echo
            exit 1
          fi

          if ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/health-response; then
            echo "Health check FAILED: response does not report ok=true"
            head -c 1000 /tmp/health-response 2>/dev/null || true
            echo
            exit 1
          fi

          if ! grep -Eq '"configured"[[:space:]]*:[[:space:]]*true' /tmp/health-response; then
            echo "Health check FAILED: Zargox provider is not configured"
            head -c 1000 /tmp/health-response 2>/dev/null || true
            echo
            exit 1
          fi

          echo "Health check OK: Zargox API is reachable and configured"

      - name: Alert on Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Health Check FAILED for MyZubster Gateway!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Report missing Slack webhook
        if: failure() && env.SLACK_WEBHOOK_URL == ''
        run: echo "Health check failed; Slack notification skipped because SLACK_WEBHOOK is not configured."
