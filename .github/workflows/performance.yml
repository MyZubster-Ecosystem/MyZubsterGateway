name: Performance Testing

on:
  push:
    branches: [main]
    paths:
      - 'scripts/k6-load-test.js'
      - '.github/workflows/performance.yml'
      - 'server.js'
      - 'routes/**'
      - 'services/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/k6-load-test.js'
      - '.github/workflows/performance.yml'
      - 'server.js'
      - 'routes/**'
      - 'services/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Test profile'
        required: true
        default: 'load'
        type: choice
        options:
          - smoke
          - load
          - stress
          - soak

jobs:
  performance:
    name: K6 Performance Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [smoke, load]
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Start server
        run: |
          PORT=3000 node server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy within 30 seconds"
          exit 1

      - name: Run ${{ matrix.profile }} tests
        run: |
          mkdir -p results
          k6 run scripts/k6-load-test.js \
            --env TEST_PROFILE=${{ matrix.profile }} \
            --summary-export=results/summary-${{ matrix.profile }}.json \
            --out json=results/metrics-${{ matrix.profile }}.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.profile }}
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Performance summary
        if: always()
        run: |
          SUMMARY_FILE="results/summary-${{ matrix.profile }}.json"
          echo "## Performance Results (${{ matrix.profile }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$SUMMARY_FILE" ]; then
            python3 - "$SUMMARY_FILE" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          summary_file = sys.argv[1]
          output_file = sys.argv[2]

          with open(summary_file, encoding="utf-8") as source:
              data = json.load(source)

          metrics = data.get("metrics", {})
          lines = ["| Metric | Value |", "|---|---:|"]
          duration = metrics.get("http_req_duration", {})
          for label, key in (("Avg", "avg"), ("P95", "p(95)"), ("P99", "p(99)"), ("Max", "max")):
              value = duration.get(key)
              if isinstance(value, (int, float)):
                  lines.append(f"| {label} | {value:.1f} ms |")
          errors = metrics.get("errors", {}).get("rate")
          if isinstance(errors, (int, float)):
              lines.append(f"| Error Rate | {errors:.2%} |")

          with open(output_file, "a", encoding="utf-8") as target:
              target.write("\n".join(lines) + "\n")
          PY
          fi

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  stress:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.49.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and start
        run: |
          npm ci --omit=dev
          PORT=3000 node server.js &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy within 30 seconds"
          exit 1

      - name: Run stress tests
        run: |
          mkdir -p results
          k6 run scripts/k6-load-test.js \
            --env TEST_PROFILE=stress \
            --summary-export=results/summary-stress.json

      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-stress
          path: results/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
