name: Canonical Local Agent

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/canonical-local-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile agent/assistant.py
      - run: python -m unittest agent/tests/test_assistant.py
