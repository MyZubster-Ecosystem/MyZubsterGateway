name: Sync MyZubster ecosystem labels

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-ecosystem-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    uses: MyZubster-Ecosystem/myzubster/.github/workflows/reusable-sync-ecosystem-labels.yml@main
    permissions:
      contents: read
      issues: write
