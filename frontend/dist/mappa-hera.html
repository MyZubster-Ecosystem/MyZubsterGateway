<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 Mappa Hera - MyZubster</title>

  <!-- Leaflet (interactive map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <style>
    :root {
      --accent: #2ecc71;
      --accent-strong: #27ae60;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef1f6;
      --text: #1f2733;
      --text-soft: #5b6675;
      --border: #e2e7ee;
      --shadow: 0 10px 30px rgba(20, 30, 50, 0.08);
      --radius: 14px;
      --status-active: #22a06b;
      --status-monitoring: #d99000;
      --status-critical: #c0392b;
      --map-tiles-filter: none;
    }
    [data-theme="dark"] {
      --accent: #34d399;
      --accent-strong: #10b981;
      --bg: #14161c;
      --surface: #1c1f27;
      --surface-2: #232733;
      --text: #e7ecf3;
      --text-soft: #a3adbd;
      --border: #2c313c;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      --map-tiles-filter: brightness(0.7) invert(1) contrast(0.85) hue-rotate(180deg) saturate(0.7);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .hm-page { display: flex; flex-direction: column; min-height: 100vh; }

    /* Header */
    .hm-header {
      display: flex; flex-wrap: wrap; gap: 16px;
      align-items: center; justify-content: space-between;
      padding: 20px 24px;
      background: linear-gradient(135deg, #27ae60, #1e8449);
      color: #fff;
    }
    .hm-header__title h1 { margin: 0; font-size: 1.5rem; }
    .hm-header__title p { margin: 4px 0 0; opacity: 0.92; font-size: 0.9rem; }
    .hm-header__actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

    .hm-theme {
      display: inline-flex; background: rgba(255,255,255,0.18);
      border-radius: 999px; padding: 3px;
    }
    .hm-theme__btn {
      border: 0; background: transparent; color: #fff; cursor: pointer;
      padding: 6px 12px; border-radius: 999px; font-size: 0.82rem;
      display: inline-flex; align-items: center; gap: 6px; opacity: 0.8;
      transition: background 0.2s, opacity 0.2s;
    }
    .hm-theme__btn.is-active { background: #fff; color: #1e8449; opacity: 1; font-weight: 600; }

    .hm-export { display: inline-flex; align-items: center; gap: 8px; }
    .hm-export__label { font-size: 0.8rem; opacity: 0.9; }

    .hm-btn {
      border: 0; cursor: pointer; border-radius: 10px; padding: 8px 14px;
      font-size: 0.85rem; font-weight: 600; transition: transform 0.12s, filter 0.2s, opacity 0.2s;
    }
    .hm-btn:active { transform: translateY(1px); }
    .hm-btn--primary { background: #fff; color: #1e8449; }
    .hm-btn--ghost { background: rgba(255,255,255,0.18); color: #fff; }
    [data-theme="dark"] .hm-btn--ghost { background: var(--surface-2); color: var(--text); }
    .hm-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* Banner */
    .hm-banner {
      margin: 14px 24px 0; padding: 10px 14px; border-radius: 10px;
      background: #fff6e0; color: #7a5b00; font-size: 0.85rem; border: 1px solid #f3dca0;
    }
    [data-theme="dark"] .hm-banner { background: #3a2f12; color: #f4d58a; border-color: #5a4a1c; }

    /* Layout */
    .hm-layout {
      flex: 1; display: grid; grid-template-columns: 340px 1fr; gap: 18px;
      padding: 18px 24px 24px; min-height: 0;
    }
    @media (max-width: 860px) {
      .hm-layout { grid-template-columns: 1fr; }
    }

    /* Sidebar */
    .hm-sidebar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
      max-height: calc(100vh - 150px); overflow: auto;
    }
    .hm-field { display: flex; flex-direction: column; gap: 5px; }
    .hm-field label { font-size: 0.78rem; color: var(--text-soft); font-weight: 600; }
    .hm-field input, .hm-field select {
      border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
      background: var(--surface); color: var(--text); font-size: 0.88rem;
    }
    .hm-field input:focus, .hm-field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .hm-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hm-sidebar__tools { display: flex; gap: 8px; }
    .hm-sidebar__tools .hm-btn { flex: 1; }
    .hm-btn--primary.hm-solid { background: var(--accent); color: #fff; }
    [data-theme="dark"] .hm-btn--primary.hm-solid { background: var(--accent); color: #06281a; }
    .hm-btn--ghost.hm-solid { background: var(--surface-2); color: var(--text); }

    .hm-inline-error { margin: 0; color: #c0392b; font-size: 0.82rem; }

    /* Summary stats */
    .hm-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; }
    .hm-summary div {
      background: var(--surface-2); border-radius: 10px; padding: 9px 6px; text-align: center;
    }
    .hm-summary dt { font-size: 0.68rem; color: var(--text-soft); margin: 0; }
    .hm-summary dd { margin: 3px 0 0; font-size: 1.05rem; font-weight: 700; }

    /* Plant list */
    .hm-list { display: flex; flex-direction: column; gap: 8px; }
    .hm-empty { color: var(--text-soft); font-size: 0.85rem; text-align: center; padding: 14px 0; }
    .hm-card {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      border: 1px solid var(--border); background: var(--surface); border-radius: 11px;
      padding: 10px 12px; cursor: pointer; transition: border-color 0.2s, transform 0.12s, background 0.2s;
    }
    .hm-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .hm-card.is-selected { border-color: var(--accent); background: var(--surface-2); }
    .hm-card__dot { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px rgba(0,0,0,0.04); }
    .hm-card__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .hm-card__name { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hm-card__meta { font-size: 0.76rem; color: var(--text-soft); }
    .hm-card__species { font-size: 0.72rem; color: var(--accent-strong); }
    .hm-card__distance { font-size: 0.74rem; font-weight: 700; color: var(--text-soft); flex: none; }

    /* Map shell */
    .hm-map-shell { position: relative; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 420px; }
    .hm-map { position: absolute; inset: 0; }
    .leaflet-tiles { filter: var(--map-tiles-filter); transition: filter 0.3s; }

    .hm-legend {
      position: absolute; left: 12px; bottom: 12px; z-index: 500;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 10px; display: flex; gap: 12px; font-size: 0.74rem; box-shadow: var(--shadow);
    }
    .hm-legend__item { display: inline-flex; align-items: center; gap: 5px; }
    .hm-legend__item i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* Detail panel */
    .hm-detail {
      position: absolute; top: 12px; right: 12px; z-index: 600; width: 290px; max-width: calc(100% - 24px);
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); padding: 16px; animation: hm-pop 0.18s ease-out;
    }
    @keyframes hm-pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .hm-detail__close {
      position: absolute; top: 8px; right: 10px; border: 0; background: transparent;
      font-size: 1.3rem; line-height: 1; color: var(--text-soft); cursor: pointer;
    }
    .hm-detail h2 { margin: 0 6px 4px 0; font-size: 1.05rem; }
    .hm-detail__place { margin: 0 0 8px; color: var(--text-soft); font-size: 0.82rem; }
    .hm-status {
      display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; color: #fff;
    }
    .hm-status--active { background: var(--status-active); }
    .hm-status--monitoring { background: var(--status-monitoring); }
    .hm-status--critical { background: var(--status-critical); }
    .hm-detail__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
    .hm-detail__grid dt { font-size: 0.68rem; color: var(--text-soft); margin: 0; }
    .hm-detail__grid dd { margin: 2px 0 0; font-weight: 600; font-size: 0.9rem; }
    .hm-detail__sensors { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0 0 10px; }
    .hm-detail__sensors li {
      background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 0.74rem;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .hm-detail__coords { font-size: 0.76rem; color: var(--text-soft); margin: 0 0 12px; }

    /* Leaflet custom pins */
    .hm-pin { width: 34px; height: 34px; transition: transform 0.2s; }
    .hm-pin.is-selected { width: 44px; height: 44px; z-index: 1000; }
    .hm-pin svg { display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,0.3)); animation: hm-drop 0.3s ease-out; }
    @keyframes hm-drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .hm-user-pin { width: 22px; height: 22px; }
    .hm-tooltip.hm-tip { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow); font-size: 0.8rem; }
    .hm-tooltip.hm-tip::before { border-top-color: var(--surface); }

    /* Toast */
    .hm-toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 900;
      background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px;
      font-size: 0.85rem; box-shadow: var(--shadow); animation: hm-pop 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div class="hm-page" data-theme="light">
    <header class="hm-header">
      <div class="hm-header__title">
        <h1>🌿 Mappa Hera</h1>
        <p>Monitoraggio piante, sensori e stato di salute del verde urbano.</p>
      </div>

      <div class="hm-header__actions">
        <div class="hm-theme" role="group" aria-label="Tema della pagina">
          <button type="button" class="hm-theme__btn" data-theme-choice="light" title="Tema chiaro">☀️ <span>Chiaro</span></button>
          <button type="button" class="hm-theme__btn" data-theme-choice="dark" title="Tema scuro">🌙 <span>Scuro</span></button>
          <button type="button" class="hm-theme__btn" data-theme-choice="system" title="Tema di sistema">🖥️ <span>Sistema</span></button>
        </div>

        <div class="hm-export" role="group" aria-label="Esporta dati">
          <span class="hm-export__label">Export</span>
          <button type="button" class="hm-btn hm-btn--ghost" data-export="csv">CSV</button>
          <button type="button" class="hm-btn hm-btn--ghost" data-export="json">JSON</button>
        </div>
      </div>
    </header>

    <div class="hm-banner" id="hm-banner" hidden>
      <strong>Dati dimostrativi.</strong> <span id="hm-banner-text"></span>
    </div>

    <div class="hm-layout">
      <aside class="hm-sidebar" aria-label="Ricerca e filtri">
        <div class="hm-field">
          <label for="hm-search">Cerca</label>
          <input id="hm-search" type="search" placeholder="Nome, specie, località, sensore…" autocomplete="off" />
        </div>

        <div class="hm-field-row">
          <div class="hm-field">
            <label for="hm-status">Stato</label>
            <select id="hm-status">
              <option value="">Tutti</option>
              <option value="active">Attivo</option>
              <option value="monitoring">Monitoraggio</option>
              <option value="critical">Critico</option>
            </select>
          </div>
          <div class="hm-field">
            <label for="hm-species">Specie</label>
            <select id="hm-species"><option value="">Tutte</option></select>
          </div>
        </div>

        <div class="hm-sidebar__tools">
          <button type="button" class="hm-btn hm-btn--primary hm-solid" id="hm-locate">📍 Trova piante vicine</button>
          <button type="button" class="hm-btn hm-btn--ghost hm-solid" id="hm-reset">Azzera filtri</button>
        </div>

        <p class="hm-inline-error" id="hm-geo-error" hidden></p>

        <dl class="hm-summary">
          <div><dt>Piante</dt><dd id="hm-count">0</dd></div>
          <div><dt>Attive</dt><dd id="hm-active">0</dd></div>
          <div><dt>Monitoraggio</dt><dd id="hm-monitoring">0</dd></div>
          <div><dt>Critiche</dt><dd id="hm-critical">0</dd></div>
        </dl>

        <div class="hm-list" id="hm-list" role="list">
          <p class="hm-empty">Caricamento piante…</p>
        </div>
      </aside>

      <section class="hm-map-shell">
        <div id="hm-map" class="hm-map" role="application" aria-label="Mappa Hera"></div>

        <div class="hm-legend" aria-hidden="true">
          <span class="hm-legend__item"><i style="background: var(--status-active)"></i>Attivo</span>
          <span class="hm-legend__item"><i style="background: var(--status-monitoring)"></i>Monitoraggio</span>
          <span class="hm-legend__item"><i style="background: var(--status-critical)"></i>Critico</span>
        </div>

        <article class="hm-detail" id="hm-detail" hidden aria-live="polite">
          <button type="button" class="hm-detail__close" id="hm-detail-close" aria-label="Chiudi dettaglio">×</button>
          <h2 id="hm-detail-name"></h2>
          <p class="hm-detail__place" id="hm-detail-place"></p>
          <span class="hm-status" id="hm-detail-status"></span>
          <dl class="hm-detail__grid">
            <div><dt>Specie</dt><dd id="hm-detail-species"></dd></div>
            <div><dt>Altezza</dt><dd id="hm-detail-height"></dd></div>
            <div><dt>Età</dt><dd id="hm-detail-age"></dd></div>
            <div><dt>Ultimo controllo</dt><dd id="hm-detail-checked"></dd></div>
          </dl>
          <ul class="hm-detail__sensors" id="hm-detail-sensors"></ul>
          <p class="hm-detail__coords" id="hm-detail-coords"></p>
        </article>
      </section>
    </div>
  </div>

  <div class="hm-toast" id="hm-toast" hidden></div>

  <script>
  (function () {
    'use strict';

    /* ----------------------------------------------------------------------
     * Config
     * -------------------------------------------------------------------- */
    var THEME_KEY = 'hm-hera-map-theme';
    var STATUS_COLORS = {
      active: '#22a06b',
      monitoring: '#d99000',
      critical: '#c0392b'
    };
    var STATUS_LABELS = {
      active: 'Attivo',
      monitoring: 'Monitoraggio',
      critical: 'Critico'
    };
    var API_URLS = [
      '/api/hera/plants',
      'http://188.213.161.186:4000/api/hera/plants'
    ];
    var TILE_LIGHT = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
    var TILE_DARK = 'https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png';

    /* ----------------------------------------------------------------------
     * Offline fallback dataset
     * Canonical shape: id, name, species, location, lat, lng, status,
     * height, age, sensors[], lastChecked
     * -------------------------------------------------------------------- */
    var FALLBACK_PLANTS = [
      { id: 'hera-rm-001', name: 'Quercia del Pincio', species: 'Quercus ilex', location: 'Roma, Pincio', lat: 41.9115, lng: 12.4765, status: 'active', height: 18, age: 85, sensors: ['umidità', 'temperatura'], lastChecked: '2026-08-05' },
      { id: 'hera-rm-002', name: 'Pino Marittimo', species: 'Pinus pinea', location: 'Roma, Villa Borghese', lat: 41.9133, lng: 12.4852, status: 'monitoring', height: 22, age: 60, sensors: ['inclinazione', 'vento'], lastChecked: '2026-07-28' },
      { id: 'hera-rm-003', name: 'Platano Monumentale', species: 'Platanus × acerifolia', location: 'Roma, Trastevere', lat: 41.8865, lng: 12.4700, status: 'critical', height: 28, age: 120, sensors: ['umidità', 'radice', 'stress idrico'], lastChecked: '2026-07-15' },
      { id: 'hera-mi-001', name: 'Magnolia di Via Dante', species: 'Magnolia grandiflora', location: 'Milano, Via Dante', lat: 45.4659, lng: 9.1862, status: 'active', height: 14, age: 45, sensors: ['umidità', 'ph'], lastChecked: '2026-08-03' },
      { id: 'hera-mi-002', name: 'Tiglio di Sempione', species: 'Tilia cordata', location: 'Milano, Parco Sempione', lat: 45.4737, lng: 9.1760, status: 'active', height: 16, age: 55, sensors: ['temperatura', 'crescita'], lastChecked: '2026-08-01' },
      { id: 'hera-mi-003', name: 'Olmo del Castello', species: 'Ulmus minor', location: 'Milano, Castello Sforzesco', lat: 45.4703, lng: 9.1798, status: 'monitoring', height: 12, age: 70, sensors: ['umidità', 'parassiti'], lastChecked: '2026-07-20' },
      { id: 'hera-na-001', name: 'Palma di San Carlo', species: 'Phoenix canariensis', location: 'Napoli, Galleria Umberto', lat: 40.8384, lng: 14.2489, status: 'critical', height: 8, age: 30, sensors: ['stress idrico', 'parassiti'], lastChecked: '2026-07-12' },
      { id: 'hera-na-002', name: 'Ficus Magnolioide', species: 'Ficus magnolioides', location: 'Napoli, Piazza del Plebiscito', lat: 40.8358, lng: 14.2468, status: 'active', height: 20, age: 90, sensors: ['umidità', 'temperatura', 'radice'], lastChecked: '2026-08-04' },
      { id: 'hera-to-001', name: 'Castagno di Villa Rey', species: 'Castanea sativa', location: 'Torino, Villa Rey', lat: 45.0508, lng: 7.6850, status: 'active', height: 15, age: 40, sensors: ['crescita', 'frutto'], lastChecked: '2026-08-02' },
      { id: 'hera-bo-001', name: 'Cedro del Libano', species: 'Cedrus libani', location: 'Bologna, Orto Botanico', lat: 44.4959, lng: 11.3425, status: 'monitoring', height: 24, age: 75, sensors: ['umidità', 'temperatura', 'vento'], lastChecked: '2026-07-25' },
      { id: 'hera-fi-001', name: 'Cipresso di Boboli', species: 'Cupressus sempervirens', location: 'Firenze, Giardino di Boboli', lat: 43.7622, lng: 11.2488, status: 'active', height: 30, age: 150, sensors: ['crescita'], lastChecked: '2026-08-06' },
      { id: 'hera-pa-001', name: 'Ficus di Villa Giulia', species: 'Ficus benghalensis', location: 'Palermo, Villa Giulia', lat: 38.1176, lng: 13.3714, status: 'critical', height: 10, age: 35, sensors: ['stress idrico', 'parassiti', 'radice'], lastChecked: '2026-07-10' },
      { id: 'hera-ve-001', name: 'Ginkgo di Cannaregio', species: 'Ginkgo biloba', location: 'Venezia, Cannaregio', lat: 45.4433, lng: 12.3224, status: 'active', height: 11, age: 25, sensors: ['umidità', 'salinità'], lastChecked: '2026-08-05' },
      { id: 'hera-ge-001', name: 'Palma di Acquasola', species: 'Trachycarpus fortunei', location: 'Genova, Piazza Acquasola', lat: 44.4051, lng: 8.9342, status: 'monitoring', height: 6, age: 20, sensors: ['parassiti', 'vento'], lastChecked: '2026-07-22' },
      { id: 'hera-ct-001', name: 'Ficus del Duomo', species: 'Ficus microcarpa', location: 'Catania, Piazza Duomo', lat: 37.5022, lng: 15.0873, status: 'active', height: 15, age: 50, sensors: ['umidità', 'temperatura'], lastChecked: '2026-08-06' }
    ];

    /* ----------------------------------------------------------------------
     * Normalization
     * -------------------------------------------------------------------- */
    var IT_STATUS = {
      attivo: 'active', attiva: 'active',
      monitoraggio: 'monitoring',
      critico: 'critical', critica: 'critical',
      pericolo: 'critical'
    };

    function toNumber(v) {
      if (typeof v === 'number') return v;
      if (v == null) return null;
      var n = parseFloat(String(v).replace(',', '.'));
      return isFinite(n) ? n : null;
    }

    function toArray(v) {
      if (Array.isArray(v)) return v.map(function (x) { return String(x); });
      if (typeof v === 'string') return v.split(/[;,]/).map(function (s) { return s.trim(); }).filter(Boolean);
      return [];
    }

    function normalizePlant(raw, index) {
      var lat = toNumber(raw.lat != null ? raw.lat : raw.latitudine);
      var lng = toNumber(raw.lng != null ? raw.lng : raw.longitudine);
      if (raw.geometry && raw.geometry.coordinates) {
        lng = toNumber(raw.geometry.coordinates[0]);
        lat = toNumber(raw.geometry.coordinates[1]);
      }
      if (lat == null || lng == null || !isFinite(lat) || !isFinite(lng)) return null;

      var statusRaw = String(raw.status != null ? raw.status : (raw.stato || 'active')).toLowerCase();
      var status = IT_STATUS[statusRaw] || statusRaw;
      if (!STATUS_COLORS[status]) status = 'active';

      return {
        id: String(raw.id != null ? raw.id : (raw.nome || ('hera-' + index))),
        name: String(raw.name != null ? raw.name : (raw.nome || 'Pianta')),
        species: String(raw.species != null ? raw.species : (raw.specie || '')),
        location: raw.location != null ? String(raw.location) : (raw.località || raw.localita || ''),
        lat: lat,
        lng: lng,
        status: status,
        height: toNumber(raw.height != null ? raw.height : raw.altezza) || 0,
        age: toNumber(raw.age != null ? raw.age : raw.età || raw.eta) || 0,
        sensors: toArray(raw.sensors != null ? raw.sensors : raw.sensori),
        lastChecked: raw.lastChecked != null ? String(raw.lastChecked) : (raw.ultimo_controllo || '')
      };
    }

    function extractList(payload) {
      if (Array.isArray(payload)) return payload;
      if (payload && typeof payload === 'object') {
        return payload.data || payload.plants || payload.piante || payload.features || [];
      }
      return [];
    }

    function fetchPlants() {
      var result = { plants: [], source: 'fallback', error: null };
      var chain = API_URLS.reduce(function (promise, url) {
        return promise.then(function (acc) {
          if (acc.done) return acc;
          return fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              return res.json();
            })
            .then(function (data) {
              var list = extractList(data).map(normalizePlant).filter(Boolean);
              if (list.length) {
                return { done: true, plants: list, source: 'api', error: null };
              }
              throw new Error('empty');
            })
            .catch(function (err) { return { done: false, error: url + ' -> ' + err.message }; });
        });
      }, Promise.resolve({ done: false, error: null }));

      return chain.then(function (acc) {
        if (acc.done) {
          result.plants = acc.plants;
          result.source = 'api';
        } else {
          result.plants = FALLBACK_PLANTS.slice();
          result.source = 'fallback';
          result.error = acc.error || 'API non disponibile';
        }
        return result;
      });
    }

    /* ----------------------------------------------------------------------
     * Formatting helpers
     * -------------------------------------------------------------------- */
    var nf = new Intl.NumberFormat('it-IT');
    function formatHeight(v) { return v ? nf.format(v) + ' m' : '—'; }
    function formatAge(v) { return v ? nf.format(v) + ' anni' : '—'; }
    function formatDate(v) {
      if (!v) return '—';
      var d = new Date(v);
      return isNaN(d.getTime()) ? String(v) : d.toLocaleDateString('it-IT');
    }
    function distanceKm(from, to) {
      function r(deg) { return deg * Math.PI / 180; }
      var R = 6371, dLat = r(to[0] - from[0]), dLng = r(to[1] - from[1]);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(r(from[0])) * Math.cos(r(to[0])) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    /* ----------------------------------------------------------------------
     * Leaflet icons
     * -------------------------------------------------------------------- */
    function pinSvg(color, selected) {
      var size = selected ? 44 : 34;
      var s = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">'
        + '<circle cx="17" cy="15" r="13" fill="' + color + '" stroke="#fff" stroke-width="3" />'
        + '<circle cx="17" cy="15" r="5" fill="#fff" opacity="0.4" />'
        + '<path d="M17 24 L12 34 L22 34 Z" fill="' + color + '" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" />'
        + '</svg>';
      return s;
    }

    function createIcon(color, selected) {
      return L.divIcon({
        className: 'hm-pin' + (selected ? ' is-selected' : ''),
        html: pinSvg(color, selected),
        iconSize: [selected ? 44 : 34, selected ? 44 : 34],
        iconAnchor: [selected ? 22 : 17, selected ? 44 : 34],
        tooltipAnchor: [0, selected ? -44 : -34]
      });
    }

    var userIcon = L.divIcon({
      className: 'hm-user-pin',
      html: '<svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">'
        + '<circle cx="11" cy="11" r="10" fill="#3b82f6" stroke="#fff" stroke-width="2.5" />'
        + '<circle cx="11" cy="11" r="4" fill="#fff" opacity="0.5" />'
        + '</svg>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    /* ----------------------------------------------------------------------
     * State
     * -------------------------------------------------------------------- */
    var map, userMarker, markers = [], plants = [], filtered = [];
    var selectedId = null, userPos = null;

    var $ = function (id) { return document.getElementById(id); };

    /* ----------------------------------------------------------------------
     * Render
     * -------------------------------------------------------------------- */
    function renderStats() {
      var total = filtered.length;
      var active = filtered.filter(function (p) { return p.status === 'active'; }).length;
      var monitoring = filtered.filter(function (p) { return p.status === 'monitoring'; }).length;
      var critical = filtered.filter(function (p) { return p.status === 'critical'; }).length;
      $('hm-count').textContent = nf.format(total);
      $('hm-active').textContent = nf.format(active);
      $('hm-monitoring').textContent = nf.format(monitoring);
      $('hm-critical').textContent = nf.format(critical);
    }

    function renderList() {
      var list = $('hm-list');
      if (!filtered.length) {
        list.innerHTML = '<p class="hm-empty">Nessuna pianta trovata</p>';
        return;
      }
      list.innerHTML = '';
      filtered.forEach(function (p) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'hm-card' + (p.id === selectedId ? ' is-selected' : '');
        card.setAttribute('role', 'listitem');
        card.setAttribute('data-id', p.id);
        card.innerHTML = '<span class="hm-card__dot" style="background:' + STATUS_COLORS[p.status] + '"></span>'
          + '<span class="hm-card__body">'
          + '<span class="hm-card__name">' + esc(p.name) + '</span>'
          + '<span class="hm-card__meta">' + esc(p.species) + ' · ' + esc(p.location) + '</span>'
          + '<span class="hm-card__species">' + esc(STATUS_LABELS[p.status]) + '</span>'
          + '</span>'
          + (userPos ? '<span class="hm-card__distance">' + formatDist(userPos, p) + '</span>' : '');
        card.addEventListener('click', function () { selectPlant(p.id); });
        list.appendChild(card);
      });
    }

    function renderMarkers() {
      markers.forEach(function (m) { map.removeLayer(m); });
      markers = [];
      filtered.forEach(function (p) {
        var color = STATUS_COLORS[p.status] || '#888';
        var icon = createIcon(color, p.id === selectedId);
        var marker = L.marker([p.lat, p.lng], { icon: icon })
          .bindTooltip(p.name, { className: 'hm-tooltip hm-tip', direction: 'top', offset: [0, -12] })
          .on('click', function () { selectPlant(p.id); });
        marker.addTo(map);
        markers.push(marker);
        if (p.id === selectedId) {
          marker.setZIndexOffset(1000);
        }
      });
    }

    function renderMap() {
      renderMarkers();
      renderList();
      renderStats();
    }

    function selectPlant(id) {
      selectedId = id;
      var p = plants.filter(function (x) { return x.id === id; })[0];
      if (!p) return hideDetail();
      showDetail(p);
      renderMap();
      if (p) {
        map.setView([p.lat, p.lng], map.getZoom() < 14 ? 14 : map.getZoom());
      }
    }

    /* ----------------------------------------------------------------------
     * Detail panel
     * -------------------------------------------------------------------- */
    function showDetail(p) {
      var d = $('hm-detail');
      $('hm-detail-name').textContent = p.name;
      $('hm-detail-place').textContent = p.location;
      var statusEl = $('hm-detail-status');
      statusEl.textContent = STATUS_LABELS[p.status] || p.status;
      statusEl.className = 'hm-status hm-status--' + (p.status || 'active');
      $('hm-detail-species').textContent = p.species;
      $('hm-detail-height').textContent = formatHeight(p.height);
      $('hm-detail-age').textContent = formatAge(p.age);
      $('hm-detail-checked').textContent = formatDate(p.lastChecked);
      var sensorsEl = $('hm-detail-sensors');
      if (p.sensors && p.sensors.length) {
        sensorsEl.innerHTML = p.sensors.map(function (s) {
          var icon = { umidità: '💧', temperatura: '🌡️', vento: '💨', crescita: '📏', 'stress idrico': '⚠️', parassiti: '🐛', radice: '🌱', inclinazione: '📐', ph: '🧪', salinità: '🧂', frutto: '🍎' }[s.toLowerCase()] || '📡';
          return '<li>' + icon + ' ' + esc(s) + '</li>';
        }).join('');
      } else {
        sensorsEl.innerHTML = '';
      }
      $('hm-detail-coords').textContent = p.lat.toFixed(4) + ', ' + p.lng.toFixed(4);
      d.removeAttribute('hidden');
    }

    function hideDetail() {
      selectedId = null;
      $('hm-detail').setAttribute('hidden', '');
      renderMap();
    }

    /* ----------------------------------------------------------------------
     * Filtering
     * -------------------------------------------------------------------- */
    var filterQuery = '', filterStatus = '', filterSpecies = '';
    function applyFilters() {
      filterQuery = ($('hm-search').value || '').toLowerCase().trim();
      filterStatus = $('hm-status').value;
      filterSpecies = $('hm-species').value;
      filtered = plants.filter(function (p) {
        if (filterStatus && p.status !== filterStatus) return false;
        if (filterSpecies && p.species !== filterSpecies) return false;
        if (filterQuery) {
          var q = filterQuery;
          return p.name.toLowerCase().indexOf(q) !== -1
            || p.species.toLowerCase().indexOf(q) !== -1
            || p.location.toLowerCase().indexOf(q) !== -1
            || p.sensors.some(function (s) { return s.toLowerCase().indexOf(q) !== -1; });
        }
        return true;
      });
      if (filtered.length && filtered.indexOf(plants.filter(function (x) { return x.id === selectedId; })[0]) === -1) {
        hideDetail();
      }
      renderMap();
    }

    var filterTimeout;
    function scheduleFilter() {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(applyFilters, 200);
    }

    /* ----------------------------------------------------------------------
     * Species set
     * -------------------------------------------------------------------- */
    function populateSpecies() {
      var speciesSet = {};
      plants.forEach(function (p) { speciesSet[p.species] = true; });
      var select = $('hm-species');
      select.innerHTML = '<option value="">Tutte</option>';
      Object.keys(speciesSet).sort().forEach(function (s) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        select.appendChild(opt);
      });
    }

    /* ----------------------------------------------------------------------
     * Export
     * -------------------------------------------------------------------- */
    function exportData(format) {
      var data = plants;
      var content, filename, mime;
      if (format === 'json') {
        content = JSON.stringify(data, null, 2);
        filename = 'hera-plants.json';
        mime = 'application/json';
      } else {
        var headers = ['id', 'name', 'species', 'location', 'lat', 'lng', 'status', 'height', 'age', 'sensors', 'lastChecked'];
        var rows = data.map(function (p) {
          return headers.map(function (h) {
            var v = p[h];
            if (Array.isArray(v)) v = v.join('; ');
            return '"' + String(v).replace(/"/g, '""') + '"';
          }).join(',');
        });
        content = headers.join(',') + '\n' + rows.join('\n');
        filename = 'hera-plants.csv';
        mime = 'text/csv';
      }
      var blob = new Blob([content], { type: mime + ';charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    /* ----------------------------------------------------------------------
     * Toast
     * -------------------------------------------------------------------- */
    var toastTimer;
    function showToast(msg) {
      var el = $('hm-toast');
      el.textContent = msg;
      el.removeAttribute('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.setAttribute('hidden', ''); }, 4000);
    }

    /* ----------------------------------------------------------------------
     * Utility
     * -------------------------------------------------------------------- */
    function esc(s) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(s));
      return d.innerHTML;
    }

    function formatDist(pos, p) {
      var d = distanceKm(pos, [p.lat, p.lng]);
      return d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km';
    }

    /* ----------------------------------------------------------------------
     * Init
     * -------------------------------------------------------------------- */
    function initMap() {
      map = L.map('hm-map', {
        center: [42.5, 12.5],
        zoom: 6,
        zoomControl: true,
        attributionControl: true
      });

      L.tileLayer(TILE_LIGHT, {
        maxZoom: 19,
        className: 'leaflet-tiles'
      }).addTo(map);

      // User location
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(function (pos) {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker(userPos, { icon: userIcon, zIndexOffset: 9999 })
            .bindTooltip('La tua posizione', { className: 'hm-tooltip hm-tip', direction: 'top' })
            .addTo(map);
          renderList();
        }, function () { /* silent */ }, { enableHighAccuracy: true, timeout: 8000 });
      }
    }

    function init() {
      initMap();

      // Load data
      fetchPlants().then(function (result) {
        plants = result.plants;
        if (result.source === 'fallback' && result.error) {
          var banner = $('hm-banner');
          $('hm-banner-text').textContent = result.error;
          banner.removeAttribute('hidden');
        }
        populateSpecies();
        filtered = plants.slice();
        renderMap();

        // Fit bounds
        if (plants.length) {
          var bounds = plants.map(function (p) { return [p.lat, p.lng]; });
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
        }
      });

      // Theme
      var savedTheme = localStorage.getItem(THEME_KEY) || 'light';
      function setTheme(choice) {
        var page = document.querySelector('.hm-page');
        page.removeAttribute('data-theme');
        if (choice === 'dark') {
          page.setAttribute('data-theme', 'dark');
          map.eachLayer(function (l) {
            if (l instanceof L.TileLayer) l.setUrl(TILE_DARK);
          });
        } else if (choice === 'light') {
          map.eachLayer(function (l) {
            if (l instanceof L.TileLayer) l.setUrl(TILE_LIGHT);
          });
        } else {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          page.setAttribute('data-theme', prefersDark ? 'dark' : '');
          map.eachLayer(function (l) {
            if (l instanceof L.TileLayer) l.setUrl(prefersDark ? TILE_DARK : TILE_LIGHT);
          });
        }
        localStorage.setItem(THEME_KEY, choice);
        document.querySelectorAll('.hm-theme__btn').forEach(function (btn) {
          btn.classList.toggle('is-active', btn.getAttribute('data-theme-choice') === choice);
        });
      }
      document.querySelectorAll('.hm-theme__btn').forEach(function (btn) {
        btn.addEventListener('click', function () { setTheme(btn.getAttribute('data-theme-choice')); });
      });
      setTheme(savedTheme);

      // Search/filter
      $('hm-search').addEventListener('input', scheduleFilter);
      $('hm-status').addEventListener('change', applyFilters);
      $('hm-species').addEventListener('change', applyFilters);

      // Tools
      $('hm-locate').addEventListener('click', function () {
        if (userPos) {
          map.setView(userPos, 14);
          showToast('📍 Centrato sulla tua posizione');
        } else {
          showToast('📍 Posizione non disponibile. Attiva la geolocalizzazione.');
        }
      });
      $('hm-reset').addEventListener('click', function () {
        $('hm-search').value = '';
        $('hm-status').value = '';
        $('hm-species').value = '';
        filterQuery = '';
        applyFilters();
        showToast('Filtri azzerati');
      });

      // Detail close
      $('hm-detail-close').addEventListener('click', hideDetail);

      // Export
      document.querySelectorAll('[data-export]').forEach(function (btn) {
        btn.addEventListener('click', function () { exportData(btn.getAttribute('data-export')); });
      });

      // Keyboard: Escape to close detail
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') hideDetail();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
