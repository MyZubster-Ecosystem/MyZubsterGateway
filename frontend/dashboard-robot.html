<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Dashboard — MyZubster</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:20px;color:#58a6ff}
.header .stats{display:flex;gap:24px;font-size:14px}
.header .stats span{color:#8b949e}
.header .stats strong{color:#f0f6fc}
.container{max-width:1400px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.card-header{background:#21262d;padding:12px 16px;border-bottom:1px solid #30363d;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px}
.robot-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #21262d;cursor:pointer;transition:background .15s}
.robot-row:hover{background:#1c2128}
.robot-row:last-child{border-bottom:none}
.robot-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px;flex-shrink:0}
.robot-info{flex:1;min-width:0}
.robot-name{font-weight:600;font-size:14px}
.robot-meta{font-size:12px;color:#8b949e;margin-top:2px}
.status-badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;flex-shrink:0}
.status-idle{background:#1c4128;color:#3fb950}
.status-working{background:#1c3a5c;color:#58a6ff}
.status-delivering{background:#3d2e00;color:#d29922}
.status-dispute{background:#3d1f1f;color:#f85149}
.detail-panel{padding:16px}
.detail-field{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #21262d;font-size:13px}
.detail-field:last-child{border-bottom:none}
.detail-label{color:#8b949e}
.detail-value{color:#f0f6fc;font-weight:500}
.job-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #21262d;font-size:13px}
.job-row:last-child{border-bottom:none}
.job-id{color:#58a6ff;margin-right:12px;min-width:60px}
.job-type{flex:1}
.job-status{font-size:12px;padding:2px 8px;border-radius:10px}
.loading{text-align:center;padding:40px;color:#8b949e}
.error{text-align:center;padding:40px;color:#f85149}
.empty{text-align:center;padding:40px;color:#8b949e}
.escrow-amount{font-size:20px;font-weight:700;color:#3fb950}
.escrow-fee{font-size:12px;color:#8b949e}
</style>
</head>
<body>
<div class="header">
  <h1>Robot Dashboard</h1>
  <div class="stats">
    <span>Active: <strong id="activeCount">-</strong></span>
    <span>Jobs Today: <strong id="jobsToday">-</strong></span>
  </div>
</div>
<div class="container">
  <div class="grid">
    <!-- Robot List -->
    <div class="card">
      <div class="card-header">Active Robots <span id="robotCount" style="color:#8b949e;font-weight:400">-</span></div>
      <div class="card-body" id="robotList"><div class="loading">Loading robots...</div></div>
    </div>
    <!-- Robot Detail -->
    <div class="card">
      <div class="card-header">Robot Detail</div>
      <div class="detail-panel" id="robotDetail"><div class="empty">Select a robot to view details</div></div>
    </div>
    <!-- Escrow Info -->
    <div class="card" style="grid-column:1/-1">
      <div class="card-header">Escrow Viewer</div>
      <div class="detail-panel" id="escrowPanel">
        <div class="detail-field"><span class="detail-label">Job ID</span><span class="detail-value" id="escrowJobId">-</span></div>
        <div class="detail-field"><span class="detail-label">Amount</span><span class="detail-value escrow-amount" id="escrowAmount">-</span></div>
        <div class="detail-field"><span class="detail-label">Fee</span><span class="detail-value" id="escrowFee">-</span></div>
        <div class="detail-field"><span class="detail-label">Net Amount</span><span class="detail-value escrow-amount" id="escrowNet">-</span></div>
        <div class="detail-field"><span class="detail-label">Status</span><span class="detail-value" id="escrowStatus">-</span></div>
      </div>
    </div>
    <!-- Job History -->
    <div class="card" style="grid-column:1/-1">
      <div class="card-header">Recent Job History <span style="color:#8b949e;font-weight:400">(last 20 events)</span></div>
      <div class="card-body" id="jobHistory"><div class="loading">Loading job history...</div></div>
    </div>
  </div>
</div>
<script>
const API_BASE = '/api/robots';

async function fetchAPI(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    return null;
  }
}

function statusBadge(status) {
  const map = {idle:'status-idle',working:'status-working',delivering:'status-delivering',dispute:'status-dispute'};
  return '<span class="status-badge '+(map[status]||'')+'">'+status+'</span>';
}

function colorFromId(id) {
  const colors = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#79c0ff','#56d364'];
  let hash = 0;
  for (let c of id) hash = ((hash<<5)-hash)+c.charCodeAt(0);
  return colors[Math.abs(hash)%colors.length];
}

async function loadRobots() {
  const data = await fetchAPI(API_BASE+'/status');
  const list = document.getElementById('robotList');
  if (!data || !data.robots || !data.robots.length) {
    list.innerHTML = '<div class="empty">No robots found</div>';
    return;
  }
  document.getElementById('robotCount').textContent = data.robots.length;
  document.getElementById('activeCount').textContent = data.robots.filter(r=>r.status!=='idle').length;
  
  list.innerHTML = data.robots.map((r,i) => {
    const color = colorFromId(r.robotId||r.id||'');
    return '<div class="robot-row" onclick="selectRobot(''+(r.robotId||r.id)+'')" data-robot=''+JSON.stringify(r).replace(/'/g,'&#39;')+''>'+
      '<div class="robot-avatar" style="background:'+color+'20;color:'+color+'">&#129302;</div>'+
      '<div class="robot-info"><div class="robot-name">'+(r.name||r.robotId||'Robot-'+(i+1))+'</div>'+
      '<div class="robot-meta">Rep: '+(r.reputation||0)+' | Earned: '+(r.totalEarned||0)+' MYZ</div></div>'+
      statusBadge(r.status||'idle')+'</div>';
  }).join('');
}

async function selectRobot(robotId) {
  const data = await fetchAPI(API_BASE+'/status/'+encodeURIComponent(robotId));
  const detail = document.getElementById('robotDetail');
  if (!data) {
    detail.innerHTML = '<div class="error">Failed to load robot details</div>';
    return;
  }
  detail.innerHTML = 
    '<div class="detail-field"><span class="detail-label">ID</span><span class="detail-value">'+(data.robotId||robotId)+'</span></div>'+
    '<div class="detail-field"><span class="detail-label">Name</span><span class="detail-value">'+(data.name||'-')+'</span></div>'+
    '<div class="detail-field"><span class="detail-label">Status</span><span class="detail-value">'+statusBadge(data.status||'idle')+'</span></div>'+
    '<div class="detail-field"><span class="detail-label">Reputation</span><span class="detail-value">'+(data.reputation||0)+'</span></div>'+
    '<div class="detail-field"><span class="detail-label">Jobs Completed</span><span class="detail-value">'+(data.completedJobs||0)+'</span></div>'+
    '<div class="detail-field"><span class="detail-label">Total Earned</span><span class="detail-value">'+(data.totalEarned||0)+' MYZ</span></div>'+
    '<div class="detail-field"><span class="detail-label">Wallet</span><span class="detail-value" style="font-size:12px">'+(data.walletAddress||'-')+'</span></div>';
  
  // Load escrow for this robot's current job
  if (data.currentJob) {
    const escrowData = await fetchAPI('/api/robot/escrow/'+encodeURIComponent(data.currentJob));
    if (escrowData) {
      document.getElementById('escrowJobId').textContent = escrowData.jobId||data.currentJob;
      document.getElementById('escrowAmount').textContent = (escrowData.amount||0)+' MYZ';
      document.getElementById('escrowFee').textContent = (escrowData.fee||0)+' MYZ';
      document.getElementById('escrowNet').textContent = (escrowData.netAmount||0)+' MYZ';
      document.getElementById('escrowStatus').textContent = escrowData.status||'pending';
    }
  }
}

async function loadHistory() {
  const data = await fetchAPI(API_BASE+'/history?limit=20');
  const history = document.getElementById('jobHistory');
  if (!data || !data.jobs || !data.jobs.length) {
    history.innerHTML = '<div class="empty">No job history</div>';
    return;
  }
  document.getElementById('jobsToday').textContent = data.jobs.length;
  history.innerHTML = data.jobs.map(j => 
    '<div class="job-row">'+
      '<span class="job-id">'+(j.jobId||j.id||'-')+'</span>'+
      '<span class="job-type">'+(j.type||j.description||'Job')+'</span>'+
      '<span class="job-status status-badge '+(j.status==='completed'?'status-idle':j.status==='dispute'?'status-dispute':'status-working')+'">'+(j.status||'unknown')+'</span>'+
    '</div>'
  ).join('');
}

loadRobots();
loadHistory();
</script>
</body>
</html>
