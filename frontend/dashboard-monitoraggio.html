<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyZubster - Monitoraggio Pagamenti</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 20px 32px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 22px; color: #38bdf8; }
    .header .live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; margin-right: 8px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-card .value { font-size: 32px; font-weight: bold; margin: 8px 0; }
    .stat-card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card.total .value { color: #38bdf8; }
    .stat-card.completed .value { color: #34d399; }
    .stat-card.pending .value { color: #fbbf24; }
    .stat-card.failed .value { color: #f87171; }
    .stat-card.volume .value { color: #a78bfa; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 18px; margin-bottom: 12px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
    th { background: #0f172a; padding: 12px 16px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; color: #94a3b8; }
    td { padding: 12px 16px; border-top: 1px solid #334155; font-size: 14px; }
    tr:hover { background: #0f172a; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: #064e3b; color: #34d399; }
    .badge-warn { background: #78350f; color: #fbbf24; }
    .badge-err { background: #7f1d1d; color: #f87171; }
    .badge-info { background: #1e3a5f; color: #38bdf8; }
    .alert-box { background: #7f1d1d; border: 1px solid #f87171; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .alert-box.warn { background: #78350f; border-color: #fbbf24; }
    .alert-box h3 { font-size: 14px; margin-bottom: 8px; }
    .alert-box ul { list-style: none; font-size: 13px; }
    .alert-box li { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .alert-box li:last-child { border-bottom: none; }
    .chart-bar { display: flex; align-items: flex-end; gap: 4px; height: 120px; margin-top: 12px; }
    .chart-bar .bar { flex: 1; background: #38bdf8; border-radius: 4px 4px 0 0; min-height: 2px; position: relative; transition: height 0.3s; }
    .chart-bar .bar:hover { background: #7dd3fc; }
    .chart-bar .bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: #64748b; white-space: nowrap; }
    .controls { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .controls button { padding: 8px 16px; border-radius: 8px; border: 1px solid #38bdf8; background: transparent; color: #38bdf8; cursor: pointer; font-size: 13px; }
    .controls button:hover { background: #38bdf8; color: #0f172a; }
    .controls button.active { background: #38bdf8; color: #0f172a; }
    .loading { text-align: center; padding: 40px; color: #64748b; }
    .empty { text-align: center; padding: 40px; color: #64748b; font-style: italic; }
    .timestamp { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="live-dot"></span>Monitoraggio Pagamenti</h1>
    <span class="timestamp" id="lastUpdate">Aggiornamento: --</span>
  </div>
  <div class="container">
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card total"><div class="label">Transazioni Totali</div><div class="value" id="statTotal">--</div></div>
      <div class="stat-card completed"><div class="label">Completate (24h)</div><div class="value" id="statCompleted">--</div></div>
      <div class="stat-card pending"><div class="label">In Attesa</div><div class="value" id="statPending">--</div></div>
      <div class="stat-card failed"><div class="label">Fallite (24h)</div><div class="value" id="statFailed">--</div></div>
      <div class="stat-card volume"><div class="label">Volume (24h)</div><div class="value" id="statVolume">--</div></div>
      <div class="stat-card"><div class="label">Escrow Attivi</div><div class="value" id="statEscrow" style="color:#f59e0b;">--</div></div>
    </div>

    <div id="alertsContainer"></div>

    <div class="section">
      <div class="controls">
        <h2 style="margin:0;padding:0;border:none;margin-right:auto;">Volume Giornaliero (7gg)</h2>
        <button onclick="loadAll()" style="margin-left:auto;">🔄 Aggiorna</button>
      </div>
      <div class="chart-bar" id="dailyChart"></div>
    </div>

    <div class="section">
      <h2>Transazioni Recenti</h2>
      <div id="recentTable"><div class="loading">Caricamento...</div></div>
    </div>

    <div class="section">
      <h2>Report 30 Giorni</h2>
      <div id="reportContainer"><div class="loading">Caricamento...</div></div>
    </div>
  </div>

  <script>
    const API = '/api/payments';

    async function loadAll() {
      await Promise.all([loadStats(), loadAlerts(), loadRecent(), loadReport()]);
      document.getElementById('lastUpdate').textContent = 'Aggiornamento: ' + new Date().toLocaleTimeString('it-IT');
    }

    async function loadStats() {
      try {
        const res = await fetch(API + '/stats');
        const json = await res.json();
        if (!json.success) return;
        const d = json.data;
        const tx = d.transactions;
        const byStatus = tx.byStatus;
        document.getElementById('statTotal').textContent = Object.values(byStatus).reduce((s, v) => s + v.count, 0);
        document.getElementById('statCompleted').textContent = tx.last24h.completed;
        document.getElementById('statPending').textContent = (byStatus.pending?.count || 0);
        document.getElementById('statFailed').textContent = tx.last24h.failed;
        document.getElementById('statVolume').textContent = tx.last24h.volume.toLocaleString() + ' XMR';
        const escTotal = Object.values(d.escrow.byStatus).reduce((s, v) => s + v.count, 0);
        document.getElementById('statEscrow').textContent = escTotal;

        // Daily chart
        const chart = document.getElementById('dailyChart');
        const daily = d.dailyVolume || [];
        if (daily.length > 0) {
          const maxVol = Math.max(...daily.map(d => d.total));
          chart.innerHTML = daily.map(d => {
            const h = maxVol > 0 ? Math.max(2, (d.total / maxVol) * 110) : 2;
            return `<div class="bar" style="height:${h}px" title="${d._id}: ${d.total} XMR (${d.count} tx)"><span class="bar-label">${d._id.slice(5)}</span></div>`;
          }).join('');
        } else {
          chart.innerHTML = '<div class="empty" style="width:100%">Nessun dato</div>';
        }
      } catch (e) { console.error(e); }
    }

    async function loadAlerts() {
      try {
        const res = await fetch(API + '/alerts');
        const json = await res.json();
        if (!json.success) return;
        const d = json.data;
        let html = '';
        if (d.stalePending.count > 0) {
          html += `<div class="alert-box warn"><h3>⚠️ ${d.stalePending.count} transazioni in attesa da oltre 30 minuti</h3><ul>`;
          d.stalePending.items.slice(0, 5).forEach(t => {
            html += `<li>TX ${t._id} — ${t.amount} ${t.currency} — ${new Date(t.createdAt).toLocaleString('it-IT')}</li>`;
          });
          html += '</ul></div>';
        }
        if (d.stuckEscrow.count > 0) {
          html += `<div class="alert-box"><h3>🚨 ${d.stuckEscrow.count} escrow in disputa/escalation</h3><ul>`;
          d.stuckEscrow.items.slice(0, 5).forEach(e => {
            html += `<li>Escrow #${e._id} — ${e.amount} ${e.currency} — status: ${e.status}</li>`;
          });
          html += '</ul></div>';
        }
        if (d.highValuePending.count > 0) {
          html += `<div class="alert-box warn"><h3>💰 ${d.highValuePending.count} transazioni di alto valore in attesa</h3><ul>`;
          d.highValuePending.items.slice(0, 5).forEach(t => {
            html += `<li>TX ${t._id} — ${t.amount} ${t.currency} — ${new Date(t.createdAt).toLocaleString('it-IT')}</li>`;
          });
          html += '</ul></div>';
        }
        document.getElementById('alertsContainer').innerHTML = html || '';
      } catch (e) { console.error(e); }
    }

    async function loadRecent() {
      try {
        const res = await fetch(API + '/stats');
        const json = await res.json();
        if (!json.success) return;
        const recent = json.data.transactions.recent || [];
        if (recent.length === 0) {
          document.getElementById('recentTable').innerHTML = '<div class="empty">Nessuna transazione</div>';
          return;
        }
        let html = '<table><thead><tr><th>ID</th><th>Mittente</th><th>Destinatario</th><th>Importo</th><th>Valuta</th><th>Tipo</th><th>Stato</th><th>Data</th></tr></thead><tbody>';
        recent.forEach(t => {
          const statusBadge = { completed: 'badge-ok', pending: 'badge-warn', failed: 'badge-err', refunded: 'badge-info' }[t.status] || 'badge-info';
          html += `<tr>
            <td class="timestamp">${String(t._id).slice(-6)}</td>
            <td>${String(t.fromUser).slice(-6)}</td>
            <td>${String(t.toUser).slice(-6)}</td>
            <td>${t.amount}</td>
            <td>${t.currency}</td>
            <td>${t.type}</td>
            <td><span class="badge ${statusBadge}">${t.status}</span></td>
            <td class="timestamp">${new Date(t.createdAt).toLocaleString('it-IT')}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('recentTable').innerHTML = html;
      } catch (e) { console.error(e); }
    }

    async function loadReport() {
      try {
        const res = await fetch(API + '/report');
        const json = await res.json();
        if (!json.success) return;
        const s = json.data.summary;
        const rate = s.totalTransactions > 0 ? Math.round(s.completedTransactions / s.totalTransactions * 100) : 0;
        document.getElementById('reportContainer').innerHTML = `
          <table>
            <tr><td>Periodo</td><td>${new Date(json.data.period.from).toLocaleDateString('it-IT')} — ${new Date(json.data.period.to).toLocaleDateString('it-IT')}</td></tr>
            <tr><td>Totale Transazioni</td><td>${s.totalTransactions}</td></tr>
            <tr><td>Completate</td><td>${s.completedTransactions} (${rate}%)</td></tr>
            <tr><td>Fallite</td><td>${s.failedTransactions}</td></tr>
            <tr><td>Rimborsate</td><td>${s.refundedTransactions}</td></tr>
            <tr><td>Volume Totale</td><td><strong>${s.totalVolume.toLocaleString()} XMR</strong></td></tr>
            <tr><td>Importo Medio</td><td>${s.averageAmount.toLocaleString()} XMR</td></tr>
          </table>`;
      } catch (e) { console.error(e); }
    }

    loadAll();
    setInterval(loadAll, 60000);
  </script>
</body>
</html>
