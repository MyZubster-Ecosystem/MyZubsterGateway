<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyZubster Robot Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--accent:#58a6ff;--green:#3fb950;--orange:#d2991d;--red:#f85149;--muted:#8b949e}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px}
header{background:var(--card);border-bottom:1px solid var(--border);padding:15px 0;position:sticky;top:0;z-index:100}
header .container{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.5em;display:flex;align-items:center;gap:10px}
header h1 span{font-size:1.8em}
.wallet-badge{background:#1a2332;border:1px solid var(--border);border-radius:8px;padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:.85em}
.wallet-badge .dot{width:8px;height:8px;background:var(--green);border-radius:50%}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0;padding:16px;background:var(--card);border-radius:12px;border:1px solid var(--border)}
.filters select,.filters input{padding:8px 14px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9em}
.filters input{flex:1;min-width:200px}
.robot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin:20px 0}
.robot-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s,border-color .2s;cursor:pointer}
.robot-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.robot-card .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.robot-card .name{font-size:1.1em;font-weight:600}
.robot-card .type-badge{font-size:.75em;padding:3px 10px;border-radius:12px;background:#1a2332;color:var(--accent);border:1px solid #1f3a5f}
.robot-card .desc{color:var(--muted);font-size:.9em;margin:10px 0;line-height:1.5}
.robot-card .stats{display:flex;gap:16px;margin:12px 0;font-size:.85em}
.robot-card .stat{display:flex;align-items:center;gap:4px}
.robot-card .stat .star{color:var(--orange)}
.robot-card .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.robot-card .price{font-size:1.3em;font-weight:700;color:var(--green)}
.robot-card .price small{font-weight:400;font-size:.7em;color:var(--muted)}
.robot-card .book-btn{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.9em;transition:background .2s}
.robot-card .book-btn:hover{background:#4090e0}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:16px;font-size:1.2em}
.modal .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.modal .detail-label{color:var(--muted)}
.modal select,.modal input[type=date]{width:100%;padding:10px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text);margin:8px 0 16px;font-size:.95em}
.modal .confirm-btn{width:100%;padding:12px;background:var(--green);color:#000;border:none;border-radius:8px;font-size:1em;font-weight:700;cursor:pointer;margin-top:8px}
.modal .cancel-btn{width:100%;padding:10px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:8px;font-size:.9em;cursor:pointer;margin-top:8px}
.modal .review{background:#0d1117;border-radius:8px;padding:12px;margin:8px 0}
.modal .review .stars{color:var(--orange)}
.dashboard-panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin:20px 0}
.dashboard-panel.active{display:block}
.dashboard-panel h2{margin-bottom:16px}
.dashboard-table{width:100%;border-collapse:collapse}
.dashboard-table th,.dashboard-table td{padding:10px;text-align:left;border-bottom:1px solid var(--border);font-size:.9em}
.dashboard-table th{color:var(--muted);font-weight:600}
.status-badge{padding:3px 10px;border-radius:12px;font-size:.8em}
.status-active{background:#1a3a1a;color:var(--green)}
.status-completed{background:#1a2a3a;color:var(--accent)}
.tabs{display:flex;gap:0;margin-bottom:20px}
.tab{padding:10px 20px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.9em;font-weight:600}
.tab:first-child{border-radius:8px 0 0 8px}
.tab:last-child{border-radius:0 8px 8px 0}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#000;padding:12px 24px;border-radius:8px;font-weight:600;z-index:300;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.robot-grid{grid-template-columns:1fr}.filters{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1><span>🤖</span> Robot Marketplace</h1>
    <div class="wallet-badge">
      <span class="dot"></span>
      <span id="walletDisplay">MYZ Wallet: Non connesso</span>
    </div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('marketplace')">🏪 Marketplace</button>
    <button class="tab" onclick="switchTab('dashboard')">📊 Dashboard Gestore</button>
  </div>

  <div id="marketplaceTab">
    <div class="filters">
      <select id="filterType" onchange="applyFilters()">
        <option value="">🤖 Tutti i tipi</option>
        <option value="trading">📈 Trading</option>
        <option value="monitoring">📡 Monitoring</option>
        <option value="data">📊 Data Analysis</option>
        <option value="defi">🏦 DeFi</option>
        <option value="security">🛡️ Security</option>
      </select>
      <select id="filterPrice" onchange="applyFilters()">
        <option value="">💰 Qualsiasi prezzo</option>
        <option value="0-50">0-50 MYZ</option>
        <option value="50-100">50-100 MYZ</option>
        <option value="100+">100+ MYZ</option>
      </select>
      <select id="filterRating" onchange="applyFilters()">
        <option value="0">⭐ Qualsiasi valutazione</option>
        <option value="4">⭐⭐⭐⭐ 4+ stelle</option>
        <option value="4.5">⭐⭐⭐⭐⭐ 4.5+ stelle</option>
      </select>
      <input type="text" id="searchInput" placeholder="🔍 Cerca robot per nome..." oninput="applyFilters()">
    </div>

    <div class="robot-grid" id="robotGrid"></div>
  </div>

  <div id="dashboardTab" style="display:none">
    <div class="dashboard-panel active">
      <h2>📊 Dashboard Gestore Robot</h2>
      <table class="dashboard-table">
        <thead>
          <tr><th>Robot</th><th>Prenotazioni</th><th>Guadagni</th><th>Valutazione</th><th>Stato</th></tr>
        </thead>
        <tbody id="dashboardBody"></tbody>
      </table>
      <div style="margin-top:20px;display:flex;gap:16px">
        <div style="flex:1;background:#0d1117;border-radius:8px;padding:16px;text-align:center">
          <div style="font-size:2em;font-weight:700;color:var(--green)" id="totalEarnings">0</div>
          <div style="color:var(--muted);font-size:.85em">MYZ Guadagnati</div>
        </div>
        <div style="flex:1;background:#0d1117;border-radius:8px;padding:16px;text-align:center">
          <div style="font-size:2em;font-weight:700;color:var(--accent)" id="totalBookings">0</div>
          <div style="color:var(--muted);font-size:.85em">Prenotazioni Totali</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="bookingModal">
  <div class="modal" id="bookingContent"></div>
</div>
<div class="modal-overlay" id="reviewModal">
  <div class="modal" id="reviewContent"></div>
</div>
<div id="toast" class="toast" style="display:none"></div>

<script>
const ROBOTS = [
  {id:1,name:"TradeMaster X",type:"trading",desc:"Bot di trading algoritmico con strategie ML. Supporta coppie MYZ/XMR e analisi tecnica in tempo reale.",price:80,rating:4.8,reviews:[{user:"Marco","stars":5,"text":"Rendimenti eccellenti! +15% in due settimane."},{user:"Sofia","stars":4.5,"text":"Molto professionale, assistenza reattiva."}],bookings:23,earnings:1840,owner:"robot-master"},
  {id:2,name:"ChainGuard Pro",type:"security",desc:"Monitoraggio sicurezza blockchain 24/7. Rilevamento anomalie, audit smart contract, alert in tempo reale.",price:120,rating:4.9,reviews:[{user:"Luca","stars":5,"text":"Ha prevenuto un attacco al nostro contratto."},{user:"Elena","stars":4.8,"text":"Indispensabile per qualsiasi progetto DeFi."}],bookings:15,earnings:1800,owner:"sec-expert"},
  {id:3,name:"DataSage AI",type:"data",desc:"Analisi on-chain avanzata con report personalizzati. Dashboard interattive e previsioni di mercato.",price:65,rating:4.5,reviews:[{user:"Andrea","stars":4,"text":"Buoni insights, migliorabile la UX."},{user:"Giulia","stars":5,"text":"Report dettagliatissimi, vale ogni MYZ."}],bookings:31,earnings:2015,owner:"data-wizard"},
  {id:4,name:"NodeWatcher",type:"monitoring",desc:"Monitoraggio nodi e infrastruttura. Uptime garantito 99.9%, notifiche Telegram/Discord, SLA incluso.",price:95,rating:4.7,reviews:[{user:"Paolo","stars":5,"text":"Mai un downtime da quando lo uso."},{user:"Chiara","stars":4.5,"text":"Ottimo, veloce nel notificare problemi."}],bookings:19,earnings:1805,owner:"nodewatch-ops"},
  {id:5,name:"YieldFarmer Pro",type:"defi",desc:"Ottimizzazione yield farming automatizzata. Strategie multi-pool, compounding automatico, risk scoring.",price:150,rating:4.6,reviews:[{user:"Roberto","stars":4.5,"text":"APY aumentato del 30% con le sue strategie."},{user:"Martina","stars":4.7,"text":"Risk management eccellente."}],bookings:8,earnings:1200,owner:"yield-master"},
  {id:6,name:"ArbitrageBot 3000",type:"trading",desc:"Arbitraggio cross-exchange con esecuzione sub-secondo. Supporta 15+ DEX e CEX.",price:200,rating:4.4,reviews:[{user:"Davide","stars":4,"text":"Profitti consistenti, setup complesso."},{user:"Alice","stars":4.8,"text":"Miglior arbitraggista sul mercato."}],bookings:12,earnings:2400,owner:"arb-master"}
];

let bookings = JSON.parse(localStorage.getItem('robotBookings')||'[]');
let userReviews = JSON.parse(localStorage.getItem('robotReviews')||'[]');

function renderRobots(filtered) {
  const grid = document.getElementById('robotGrid');
  grid.innerHTML = filtered.map(r => `
    <div class="robot-card" onclick="openBooking(${r.id})">
      <div class="header">
        <div class="name">🤖 ${r.name}</div>
        <span class="type-badge">${r.type}</span>
      </div>
      <div class="desc">${r.desc}</div>
      <div class="stats">
        <div class="stat"><span class="star">⭐</span> ${r.rating}</div>
        <div class="stat">📋 ${r.bookings} prenotazioni</div>
        <div class="stat">👤 ${r.owner}</div>
      </div>
      <div class="price-row">
        <div class="price">${r.price} <small>MYZ/ora</small></div>
        <button class="book-btn" onclick="event.stopPropagation();openBooking(${r.id})">Prenota</button>
      </div>
    </div>
  `).join('');
}

function applyFilters() {
  let robots = [...ROBOTS];
  const type = document.getElementById('filterType').value;
  const price = document.getElementById('filterPrice').value;
  const rating = parseFloat(document.getElementById('filterRating').value)||0;
  const search = document.getElementById('searchInput').value.toLowerCase();
  if(type) robots = robots.filter(r => r.type === type);
  if(price) {
    const [min,max] = price === '100+' ? [100,99999] : price.split('-').map(Number);
    robots = robots.filter(r => r.price >= min && r.price <= max);
  }
  if(rating) robots = robots.filter(r => r.rating >= rating);
  if(search) robots = robots.filter(r => r.name.toLowerCase().includes(search) || r.desc.toLowerCase().includes(search));
  renderRobots(robots);
}

function openBooking(robotId) {
  const robot = ROBOTS.find(r => r.id === robotId);
  const allReviews = [...robot.reviews, ...userReviews.filter(rv => rv.robotId === robotId)];
  const avgRating = allReviews.length ? (allReviews.reduce((s,r) => s + r.stars, 0) / allReviews.length).toFixed(1) : 'N/A';
  
  document.getElementById('bookingContent').innerHTML = `
    <h3>🤖 ${robot.name}</h3>
    <div class="detail-row"><span class="detail-label">Tipo</span><span>${robot.type}</span></div>
    <div class="detail-row"><span class="detail-label">Prezzo</span><span style="color:var(--green);font-weight:700">${robot.price} MYZ/ora</span></div>
    <div class="detail-row"><span class="detail-label">Valutazione</span><span>⭐ ${avgRating} (${allReviews.length} recensioni)</span></div>
    <div class="detail-row"><span class="detail-label">Prenotazioni</span><span>${robot.bookings}</span></div>
    <div class="detail-row"><span class="detail-label">Gestore</span><span>@${robot.owner}</span></div>
    <p style="margin:16px 0;color:var(--muted)">${robot.desc}</p>
    
    <h4 style="margin-top:16px">🗓️ Prenota questo robot</h4>
    <label>Data</label>
    <input type="date" id="bookingDate" min="${new Date().toISOString().split('T')[0]}">
    <label>Ore</label>
    <select id="bookingHours">
      <option value="1">1 ora — ${robot.price} MYZ</option>
      <option value="2">2 ore — ${robot.price*2} MYZ</option>
      <option value="4">4 ore — ${robot.price*4} MYZ</option>
      <option value="8">8 ore — ${robot.price*8} MYZ</option>
    </select>
    <p style="text-align:center;margin:8px 0;color:var(--muted);font-size:.85em">🔒 Pagamento in MYZ/XMR con escrow integrato</p>
    <button class="confirm-btn" onclick="confirmBooking(${robotId})">✅ Conferma Prenotazione</button>
    <button class="cancel-btn" onclick="closeModal('bookingModal')">✕ Chiudi</button>
    
    <h4 style="margin-top:20px">⭐ Recensioni</h4>
    ${allReviews.map(r => `
      <div class="review">
        <div class="stars">${'⭐'.repeat(Math.round(r.stars))} (${r.stars})</div>
        <div style="color:var(--muted);font-size:.85em">@${r.user}: "${r.text}"</div>
      </div>
    `).join('')}
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <select id="reviewStars">
        <option value="5">⭐⭐⭐⭐⭐</option>
        <option value="4">⭐⭐⭐⭐</option>
        <option value="3">⭐⭐⭐</option>
        <option value="2">⭐⭐</option>
        <option value="1">⭐</option>
      </select>
      <input type="text" id="reviewText" placeholder="Scrivi una recensione..." style="flex:1;padding:8px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <button class="book-btn" onclick="submitReview(${robotId})" style="white-space:nowrap">Invia</button>
    </div>
  `;
  document.getElementById('bookingModal').classList.add('active');
}

function confirmBooking(robotId) {
  const robot = ROBOTS.find(r => r.id === robotId);
  const hours = parseInt(document.getElementById('bookingHours').value);
  const date = document.getElementById('bookingDate').value;
  if(!date){showToast('❌ Seleziona una data');return;}
  bookings.push({
    robotId, robotName: robot.name, date, hours, 
    total: robot.price * hours, 
    status: 'active',
    payment: 'escrow',
    id: Date.now()
  });
  localStorage.setItem('robotBookings', JSON.stringify(bookings));
  closeModal('bookingModal');
  showToast(`✅ ${robot.name} prenotato! ${robot.price*hours} MYZ in escrow.`);
  renderDashboard();
}

function submitReview(robotId) {
  const stars = parseInt(document.getElementById('reviewStars').value);
  const text = document.getElementById('reviewText').value || 'Ottimo servizio!';
  userReviews.push({robotId, stars, text, user: 'Tu', date: new Date().toISOString()});
  localStorage.setItem('robotReviews', JSON.stringify(userReviews));
  openBooking(robotId);
  showToast('⭐ Recensione pubblicata!');
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => {if(t.textContent.includes(tab==='marketplace'?'Marketplace':'Dashboard')) t.classList.add('active')});
  document.getElementById('marketplaceTab').style.display = tab === 'marketplace' ? 'block' : 'none';
  document.getElementById('dashboardTab').style.display = tab === 'dashboard' ? 'block' : 'none';
  if(tab === 'dashboard') renderDashboard();
}

function renderDashboard() {
  const tbody = document.getElementById('dashboardBody');
  tbody.innerHTML = bookings.map(b => {
    const robot = ROBOTS.find(r => r.id === b.robotId);
    return `
      <tr>
        <td>🤖 ${b.robotName}</td>
        <td>${b.date} (${b.hours}h)</td>
        <td style="color:var(--green)">${b.total} MYZ</td>
        <td>⭐ ${robot?.rating||'N/A'}</td>
        <td><span class="status-badge ${b.status==='active'?'status-active':'status-completed'}">${b.status==='active'?'Attivo':'Completato'}</span></td>
      </tr>
    `;
  }).join('');
  if(!bookings.length) tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">Nessuna prenotazione ancora</td></tr>';
  
  const totalEarn = bookings.reduce((s,b) => s + b.total, 0);
  document.getElementById('totalEarnings').textContent = totalEarn + ' MYZ';
  document.getElementById('totalBookings').textContent = bookings.length;
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

document.querySelectorAll('.modal-overlay').forEach(ov => {
  ov.addEventListener('click', e => {if(e.target === ov) ov.classList.remove('active')});
});

// Init
renderRobots(ROBOTS);
</script>
</body>
</html>
