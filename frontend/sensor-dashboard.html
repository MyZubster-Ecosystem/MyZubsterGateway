<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyZubster - Dashboard Sensori IoT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0e17; color: #e0e0e0; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1a1f2e, #2d1f3d); padding: 1.5rem; text-align: center; border-bottom: 2px solid #4CAF50; }
    .header h1 { font-size: 1.8rem; color: #4CAF50; }
    .header p { color: #888; margin-top: 0.3rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .garden-input { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .garden-input input { flex: 1; padding: 0.7rem 1rem; background: #1a1f2e; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 1rem; }
    .garden-input button { padding: 0.7rem 1.5rem; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .garden-input button:hover { background: #45a049; }
    .sensor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .sensor-card { background: #1a1f2e; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.2rem; text-align: center; }
    .sensor-card .label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .sensor-card .value { font-size: 2.5rem; font-weight: bold; margin: 0.5rem 0; }
    .sensor-card .unit { color: #666; font-size: 0.9rem; }
    .sensor-card.ph .value { color: #2196F3; }
    .sensor-card.ec .value { color: #FF9800; }
    .sensor-card.temp .value { color: #f44336; }
    .sensor-card.humidity .value { color: #00BCD4; }
    .history { background: #1a1f2e; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; }
    .history h3 { color: #4CAF50; margin-bottom: 1rem; }
    .history-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
    .history-item:last-child { border-bottom: none; }
    .ws-status { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; }
    .ws-status.connected { background: #4CAF50; }
    .ws-status.disconnected { background: #f44336; }
    .add-form { background: #1a1f2e; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-top: 1.5rem; }
    .add-form h3 { color: #4CAF50; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.8rem; }
    .form-grid input { padding: 0.6rem; background: #0a0e17; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; }
    .form-grid button { grid-column: 1/-1; padding: 0.7rem; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🌱 MyZubster - Sensori IoT</h1>
    <p>Monitoraggio in tempo reale per orti urbani</p>
    <span id="wsStatus"><span class="ws-status disconnected" id="wsDot"></span>WebSocket: <span id="wsText">disconnesso</span></span>
  </div>
  <div class="container">
    <div class="garden-input">
      <input type="text" id="gardenIdInput" placeholder="Inserisci Garden ID (es: orto-milano-1)">
      <button onclick="loadGarden()">🔍 Carica Dati</button>
    </div>
    <div class="sensor-grid" id="sensorGrid">
      <div class="sensor-card ph"><div class="label">pH</div><div class="value" id="phValue">--</div><div class="unit">0-14</div></div>
      <div class="sensor-card ec"><div class="label">EC</div><div class="value" id="ecValue">--</div><div class="unit">μS/cm</div></div>
      <div class="sensor-card temp"><div class="label">Temperatura</div><div class="value" id="tempValue">--</div><div class="unit">°C</div></div>
      <div class="sensor-card humidity"><div class="label">Umidita</div><div class="value" id="humValue">--</div><div class="unit">%</div></div>
    </div>
    <div class="history">
      <h3>📊 Storico Letture</h3>
      <div id="historyList"><p style="color:#666">Inserisci un Garden ID per visualizzare i dati</p></div>
    </div>
    <div class="add-form">
      <h3>➕ Aggiungi Lettura Sensore</h3>
      <div class="form-grid">
        <input type="number" id="addPh" placeholder="pH (es: 6.8)" step="0.1">
        <input type="number" id="addEc" placeholder="EC (es: 1200)">
        <input type="number" id="addTemp" placeholder="Temperatura (es: 22.5)" step="0.1">
        <input type="number" id="addHum" placeholder="Umidita (es: 65)">
        <button onclick="addReading()">📤 Invia Lettura</button>
      </div>
    </div>
  </div>
  <script>
    let currentGarden = '';
    let ws = null;

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws');
      ws.onopen = () => {
        document.getElementById('wsDot').className = 'ws-status connected';
        document.getElementById('wsText').textContent = 'connesso';
        ws.send(JSON.stringify({ type: 'subscribe', channel: 'sensors' }));
      };
      ws.onclose = () => {
        document.getElementById('wsDot').className = 'ws-status disconnected';
        document.getElementById('wsText').textContent = 'disconnesso';
        setTimeout(connectWS, 5000);
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'sensorUpdate' && msg.gardenId === currentGarden) {
          updateLatest(msg.data);
          loadGarden();
        }
      };
      ws.onerror = () => ws.close();
    }

    function updateLatest(data) {
      if (data.ph !== undefined) document.getElementById('phValue').textContent = data.ph;
      if (data.ec !== undefined) document.getElementById('ecValue').textContent = data.ec;
      if (data.temperature !== undefined) document.getElementById('tempValue').textContent = data.temperature;
      if (data.humidity !== undefined) document.getElementById('humValue').textContent = data.humidity;
    }

    async function loadGarden() {
      currentGarden = document.getElementById('gardenIdInput').value.trim();
      if (!currentGarden) return alert('Inserisci un Garden ID');
      try {
        const resp = await fetch('/api/sensors/' + currentGarden + '/latest');
        const latest = await resp.json();
        if (latest.success && latest.data) updateLatest(latest.data);
        const histResp = await fetch('/api/sensors/' + currentGarden + '?days=7');
        const hist = await histResp.json();
        if (hist.success) {
          const list = document.getElementById('historyList');
          list.innerHTML = hist.data.slice(0, 20).map(d =>
            '<div class="history-item"><span>' + new Date(d.timestamp).toLocaleString('it-IT') + '</span><span>pH:' + (d.ph||'-') + ' EC:' + (d.ec||'-') + ' T:' + (d.temperature||'-') + '&deg; H:' + (d.humidity||'-') + '%</span></div>'
          ).join('');
        }
      } catch(e) { console.error(e); }
    }

    async function addReading() {
      if (!currentGarden) return alert('Carica prima un garden!');
      const body = {};
      const ph = document.getElementById('addPh').value;
      const ec = document.getElementById('addEc').value;
      const temp = document.getElementById('addTemp').value;
      const hum = document.getElementById('addHum').value;
      if (ph) body.ph = parseFloat(ph);
      if (ec) body.ec = parseFloat(ec);
      if (temp) body.temperature = parseFloat(temp);
      if (hum) body.humidity = parseFloat(hum);
      if (!body.ph) return alert('Il pH e obbligatorio');
      try {
        const resp = await fetch('/api/sensors/' + currentGarden, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const result = await resp.json();
        if (result.success) { loadGarden(); alert('Lettura inviata!'); }
        else alert('Errore: ' + result.error);
      } catch(e) { console.error(e); }
    }

    connectWS();
    document.getElementById('gardenIdInput').addEventListener('keypress', e => { if (e.key==='Enter') loadGarden(); });
  </script>
</body>
</html>
