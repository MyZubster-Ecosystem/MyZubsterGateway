<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benzina XMR - Pagamento QR Code</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }
        .container {
            max-width: 480px;
            width: 100%;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .title {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 5px;
            color: #ff6b35;
        }
        .subtitle {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 25px;
        }
        .pump-info {
            background: rgba(255,107,53,0.15);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,107,53,0.3);
        }
        .pump-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.95em;
        }
        .pump-row .label { color: #999; }
        .pump-row .value { font-weight: 600; color: #ff6b35; }
        .qr-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin: 20px auto;
            display: inline-block;
            box-shadow: 0 8px 32px rgba(255,107,53,0.2);
        }
        .xmr-address {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            word-break: break-all;
            color: #f7931a;
            margin: 15px 0;
            border: 1px solid rgba(247,147,26,0.3);
        }
        .amount-display {
            font-size: 2em;
            font-weight: 700;
            color: #f7931a;
            margin: 10px 0;
        }
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            margin: 10px 0;
        }
        .status-pending { background: rgba(255,193,7,0.2); color: #ffc107; border: 1px solid rgba(255,193,7,0.3); }
        .status-confirming { background: rgba(3,218,198,0.2); color: #03dac6; border: 1px solid rgba(3,218,198,0.3); }
        .status-confirmed { background: rgba(0,230,118,0.2); color: #00e676; border: 1px solid rgba(0,230,118,0.3); }
        .status-failed { background: rgba(255,82,82,0.2); color: #ff5252; border: 1px solid rgba(255,82,82,0.3); }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #f7931a);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        .timer {
            font-size: 0.85em;
            color: #999;
            margin-top: 15px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #f7931a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 400px) {
            .container { padding: 10px; }
            .card { padding: 20px; }
            .amount-display { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⛽</div>
            <div class="title">Benzina XMR</div>
            <div class="subtitle">Pagamento Monero alla pompa</div>
            
            <div class="pump-info" id="pumpInfo">
                <div class="pump-row">
                    <span class="label">Pompa:</span>
                    <span class="value" id="pumpId">#42</span>
                </div>
                <div class="pump-row">
                    <span class="label">Carburante:</span>
                    <span class="value" id="fuelType">Benzina</span>
                </div>
                <div class="pump-row">
                    <span class="label">Litri:</span>
                    <span class="value" id="liters">25.0 L</span>
                </div>
            </div>

            <div class="amount-display" id="xmrAmount">
                <span class="spinner" id="amountSpinner" style="display:none"></span>
                <span id="amountValue">0.042</span> XMR
            </div>

            <div class="qr-container" id="qrCode"></div>

            <div class="xmr-address" id="xmrAddress">
                Caricamento indirizzo...
            </div>

            <div id="statusSection">
                <div class="status-badge status-pending" id="statusBadge">
                    In attesa di pagamento
                </div>
            </div>

            <button class="btn btn-primary" id="checkBtn" onclick="checkPayment()">
                Verifica Pagamento
            </button>
            <button class="btn btn-secondary" id="cancelBtn" onclick="cancelPayment()" style="display:none">
                Annulla
            </button>
            <button class="btn btn-primary" id="unlockBtn" onclick="unlockPump()" style="display:none; background: linear-gradient(135deg, #00e676, #00c853);">
                Sblocca Pompa
            </button>

            <div class="timer" id="timer"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let xmrAddress = '';
        let xmrAmount = 0;
        let checkInterval = null;
        let paymentConfirmed = false;
        let expireTime = null;

        async function initQR() {
            try {
                const resp = await fetch(`${API_BASE}/wallet/xmr`);
                const data = await resp.json();
                xmrAddress = data.address || '44AFFq5kSiGBoZ4NMDwYtN18obc8AemS33DBLWs3H7otXft3XjrpDtQGv7SqSsaBYBb98uNbr2VBBEt7f2wfn3RVGQBEP3A';
                
                // Calculate XMR amount from EUR (approx 150 EUR/tank = ~0.9 XMR at ~165 EUR/XMR)
                xmrAmount = parseFloat((0.042).toFixed(6));

                document.getElementById('xmrAddress').textContent = xmrAddress;
                document.getElementById('amountValue').textContent = xmrAmount.toFixed(6);

                // Generate QR code
                const qrData = `monero:${xmrAddress}?tx_amount=${xmrAmount}&tx_description=Benzina+Pompa+42`;
                new QRCode(document.getElementById('qrCode'), {
                    text: qrData,
                    width: 200,
                    height: 200,
                    colorDark: '#1a1a2e',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.M
                });

                // Set expiry (15 minutes)
                expireTime = Date.now() + 15 * 60 * 1000;
                updateTimer();
                setInterval(updateTimer, 1000);

                // Auto-check every 5 seconds
                checkInterval = setInterval(checkPayment, 5000);

            } catch (err) {
                console.error('Init error:', err);
                document.getElementById('xmrAddress').textContent = 'Errore nel caricamento. Riprova.';
            }
        }

        function updateTimer() {
            if (!expireTime) return;
            const remaining = Math.max(0, expireTime - Date.now());
            const mins = Math.floor(remaining / 60000);
            const secs = Math.floor((remaining % 60000) / 1000);
            document.getElementById('timer').textContent = `Scade in: ${mins}:${secs.toString().padStart(2,'0')}`;
            
            if (remaining <= 0 && !paymentConfirmed) {
                updateStatus('Scaduto', 'status-failed');
                clearInterval(checkInterval);
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('cancelBtn').style.display = 'inline-block';
            }
        }

        async function checkPayment() {
            if (paymentConfirmed) return;

            document.getElementById('checkBtn').disabled = true;
            document.getElementById('checkBtn').innerHTML = '<span class="spinner"></span> Verifica...';

            updateStatus('Verifica in corso...', 'status-confirming');

            try {
                const resp = await fetch(`${API_BASE}/wallet/xmr/check?address=${encodeURIComponent(xmrAddress)}&amount=${xmrAmount}`);
                const data = await resp.json();

                if (data.confirmed || data.received) {
                    paymentConfirmed = true;
                    clearInterval(checkInterval);
                    updateStatus('Pagamento Ricevuto!', 'status-confirmed');
                    document.getElementById('checkBtn').style.display = 'none';
                    document.getElementById('unlockBtn').style.display = 'inline-block';
                    
                    // Notify server
                    await fetch(`${API_BASE}/payments/confirm`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ 
                            type: 'xmr_qr',
                            pump_id: '42',
                            amount: xmrAmount,
                            address: xmrAddress,
                            status: 'paid'
                        })
                    });
                } else {
                    updateStatus('In attesa di pagamento', 'status-pending');
                }
            } catch (err) {
                console.error('Check error:', err);
                updateStatus('Errore connessione. Riprova.', 'status-failed');
            } finally {
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('checkBtn').innerHTML = 'Verifica Pagamento';
            }
        }

        async function unlockPump() {
            try {
                await fetch(`${API_BASE}/payments/confirm`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        type: 'xmr_qr',
                        pump_id: '42',
                        action: 'unlock',
                        status: 'unlocked'
                    })
                });
                updateStatus('Pompa Sbloccata! Buon viaggio!', 'status-confirmed');
                document.getElementById('unlockBtn').disabled = true;
                document.getElementById('unlockBtn').textContent = 'Pompa Sbloccata';
                
                setTimeout(() => {
                    document.getElementById('unlockBtn').textContent = 'Nuova Transazione';
                    document.getElementById('unlockBtn').disabled = false;
                    document.getElementById('unlockBtn').onclick = resetPayment;
                }, 3000);
            } catch (err) {
                console.error('Unlock error:', err);
                updateStatus('Errore sblocco pompa', 'status-failed');
            }
        }

        function updateStatus(text, className) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = text;
            badge.className = 'status-badge ' + className;
        }

        function cancelPayment() {
            clearInterval(checkInterval);
            document.getElementById('statusBadge').textContent = 'Annullato';
            document.getElementById('statusBadge').className = 'status-badge status-failed';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('checkBtn').style.display = 'none';
            setTimeout(resetPayment, 2000);
        }

        function resetPayment() {
            paymentConfirmed = false;
            expireTime = Date.now() + 15 * 60 * 1000;
            document.getElementById('statusBadge').textContent = 'In attesa di pagamento';
            document.getElementById('statusBadge').className = 'status-badge status-pending';
            document.getElementById('checkBtn').style.display = 'inline-block';
            document.getElementById('unlockBtn').style.display = 'none';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('checkBtn').innerHTML = 'Verifica Pagamento';
            checkInterval = setInterval(checkPayment, 5000);
        }

        // Initialize
        initQR();
    </script>
</body>
</html>
