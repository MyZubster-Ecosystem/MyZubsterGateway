<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 ZORGAX - Connessione Terra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            color: #00ffaa;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(0, 255, 170, 0.05);
            border-radius: 30px;
            border: 2px solid #00ffaa;
            box-shadow: 0 0 100px rgba(0, 255, 170, 0.2);
            max-width: 900px;
            width: 95%;
            animation: glow 3s infinite alternate;
        }
        @keyframes glow {
            0% { box-shadow: 0 0 50px rgba(0, 255, 170, 0.2); }
            100% { box-shadow: 0 0 150px rgba(0, 255, 170, 0.6); }
        }
        .alien { font-size: 80px; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-30px); } }
        h1 { font-size: 2.5em; color: #ff6bff; margin: 20px 0; text-shadow: 0 0 30px #ff6bff; }
        .status { 
            display: inline-block; 
            padding: 10px 30px; 
            border-radius: 30px; 
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid #00ffaa;
            margin: 10px 0;
        }
        .status.online { border-color: #00ffaa; color: #00ffaa; }
        .status.offline { border-color: #ff6b6b; color: #ff6b6b; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .card {
            background: rgba(0, 255, 170, 0.03);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 170, 0.2);
        }
        .card-label { font-size: 0.8em; color: #ff6bff; }
        .card-value { font-size: 1.5em; font-weight: bold; margin-top: 5px; }
        
        .message-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 120px;
            border-left: 4px solid #ff6bff;
            text-align: left;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        input {
            flex: 1;
            padding: 15px;
            background: rgba(0, 255, 170, 0.05);
            border: 2px solid #00ffaa;
            border-radius: 15px;
            color: #00ffaa;
            font-size: 1em;
            outline: none;
        }
        input:focus { border-color: #ff6bff; box-shadow: 0 0 30px rgba(255, 107, 255, 0.2); }
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #ff6bff, #00ffaa);
            border: none;
            border-radius: 15px;
            color: #0a0a1a;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 107, 255, 0.4); }
        .connect-btn { background: linear-gradient(135deg, #00ffaa, #00ff88); }
        .disconnect-btn { background: linear-gradient(135deg, #ff6b6b, #ff4444); }
        
        .signals {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .signal {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ffaa;
            animation: pulse 1s infinite;
        }
        .signal:nth-child(2) { animation-delay: 0.2s; }
        .signal:nth-child(3) { animation-delay: 0.4s; }
        .signal.inactive { background: #333; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .input-area { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="alien">👽</div>
        <h1>ZORGAX - Connessione Terra</h1>
        <div class="status offline" id="status">⛔ DISCONNESSO</div>
        
        <div style="margin: 10px 0;">
            <button class="connect-btn" onclick="connectEarth()">🌍 Connetti con la Terra</button>
            <button class="disconnect-btn" onclick="disconnectEarth()" style="margin-left:10px;">🔌 Disconnetti</button>
        </div>
        
        <div class="signals" id="signals">
            <div class="signal inactive"></div>
            <div class="signal inactive"></div>
            <div class="signal inactive"></div>
        </div>
        
        <div class="grid">
            <div class="card">
                <div class="card-label">🌡️ Temperatura Terra</div>
                <div class="card-value" id="temp">-- °C</div>
            </div>
            <div class="card">
                <div class="card-label">💧 Umidità</div>
                <div class="card-value" id="humidity">-- %</div>
            </div>
            <div class="card">
                <div class="card-label">🌍 Popolazione</div>
                <div class="card-value" id="population">-- M</div>
            </div>
            <div class="card">
                <div class="card-label">⚡ Energia Globale</div>
                <div class="card-value" id="energy">-- %</div>
            </div>
        </div>
        
        <div class="message-box" id="messages">
            <div style="color: #ff6bff; font-weight: bold;">📡 Sistema di Comunicazione Intergalattico</div>
            <div style="margin-top: 10px;">👽 ZORGAX: "Pronto per connettermi con la Terra..."</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Messaggio per ZORGAX..." />
            <button onclick="sendMessage()">Invia 📡</button>
        </div>
    </div>

    <script>
        let connected = false;
        let updateInterval = null;
        
        // 🌍 Connetti
        async function connectEarth() {
            try {
                const response = await fetch('/api/alien/connect', { method: 'POST' });
                const data = await response.json();
                
                if (data.success) {
                    connected = true;
                    document.getElementById('status').className = 'status online';
                    document.getElementById('status').textContent = '✅ CONNESSO ALLA TERRA';
                    document.getElementById('signals').querySelectorAll('.signal').forEach(s => s.className = 'signal');
                    addMessage('👽 ZORGAX', '🌍 Connessione stabilita! Ricevo i dati dalla Terra...');
                    
                    if (!updateInterval) startUpdates();
                }
            } catch (error) {
                addMessage('⚠️ Errore', 'Errore connessione: ' + error.message);
            }
        }
        
        // 🔌 Disconnetti
        async function disconnectEarth() {
            try {
                await fetch('/api/alien/disconnect', { method: 'POST' });
                connected = false;
                document.getElementById('status').className = 'status offline';
                document.getElementById('status').textContent = '⛔ DISCONNESSO';
                document.getElementById('signals').querySelectorAll('.signal').forEach(s => s.className = 'signal inactive');
                
                if (updateInterval) {
                    clearInterval(updateInterval);
                    updateInterval = null;
                }
                
                addMessage('👽 ZORGAX', '🔌 Connessione Terra terminata.');
            } catch (error) {
                addMessage('⚠️ Errore', 'Errore disconnessione: ' + error.message);
            }
        }
        
        // 📡 Aggiorna dati
        async function startUpdates() {
            updateInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/alien/earth-data');
                    const data = await response.json();
                    const earth = data.data;
                    
                    document.getElementById('temp').textContent = earth.temperature + ' °C';
                    document.getElementById('humidity').textContent = earth.humidity + ' %';
                    document.getElementById('population').textContent = earth.population + ' M';
                    document.getElementById('energy').textContent = earth.energy + ' %';
                    
                } catch (error) {
                    console.error('Errore aggiornamento:', error);
                }
            }, 3000);
        }
        
        // 💬 Invia messaggio
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;
            if (!connected) {
                addMessage('⚠️ ZORGAX', 'Non sono connesso alla Terra. Connettimi prima!');
                input.value = '';
                return;
            }
            
            addMessage('🧑 Tu', message);
            input.value = '';
            
            try {
                const response = await fetch('/api/alien/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                addMessage('👽 ZORGAX', data.response);
            } catch (error) {
                addMessage('⚠️ Errore', 'Errore comunicazione: ' + error.message);
            }
        }
        
        // 📝 Aggiungi messaggio
        function addMessage(sender, text) {
            const box = document.getElementById('messages');
            const entry = document.createElement('div');
            entry.style.marginTop = '10px';
            entry.innerHTML = `<strong>${sender}:</strong> ${text}`;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
            
            // Mantieni ultimi 20 messaggi
            while (box.children.length > 20) {
                box.removeChild(box.firstChild);
            }
        }
        
        // Enter key
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        
        // Caricamento automatico
        window.onload = function() {
            addMessage('👽 ZORGAX', '🌍 Pronto per la connessione intergalattica!');
        };
    </script>
</body>
</html>
