<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zorgax — Importa dati</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    body { margin: 0; background: #0b1020; color: #eef2ff; }
    main { max-width: 980px; margin: 0 auto; padding: 32px 20px 56px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #aab3cf; }
    .panel { background: #121a31; border: 1px solid #29324d; border-radius: 16px; padding: 20px; margin-top: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    label { display: grid; gap: 7px; font-weight: 600; }
    input, select, button { font: inherit; }
    input, select { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid #394462; background: #0d1428; color: #fff; padding: 11px 12px; }
    button { border: 0; border-radius: 10px; padding: 11px 15px; cursor: pointer; font-weight: 700; }
    button.primary { background: #6d7cff; color: #fff; }
    button.danger { background: #d84b67; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
    .status { white-space: pre-wrap; padding: 12px; border-radius: 10px; background: #0d1428; border: 1px solid #29324d; margin-top: 14px; min-height: 24px; }
    .warnings { color: #ffd38a; }
    .ok { color: #8ce7b1; }
    .error { color: #ff9caf; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
    th, td { text-align: left; vertical-align: top; border-bottom: 1px solid #29324d; padding: 8px; max-width: 320px; overflow-wrap: anywhere; }
    th { color: #bac4e8; }
    .scroll { overflow-x: auto; }
    .confirm { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
    .confirm input { width: auto; }
    code { color: #d9e0ff; }
  </style>
</head>
<body>
<main>
  <h1>Zorgax — Importa dati ambientali</h1>
  <p class="muted">Carica un file CSV o JSON. Zorgax esegue prima una preview e non scrive nulla nel database finché non confermi esplicitamente.</p>

  <section class="panel">
    <div class="grid">
      <label>Tipo dataset
        <input id="datasetType" placeholder="es. water-quality" autocomplete="off" />
      </label>
      <label>Fonte
        <input id="source" placeholder="es. Terra&AcquaTech" autocomplete="off" />
      </label>
      <label>Chiave import
        <input id="importKey" type="password" placeholder="DATA_IMPORT_KEY" autocomplete="new-password" />
      </label>
      <label>File
        <input id="file" type="file" accept=".csv,.json,text/csv,application/json" />
      </label>
    </div>

    <div class="actions">
      <button id="previewBtn" class="primary">Analizza e mostra preview</button>
      <span class="muted">La chiave viene inviata solo nell'header <code>x-import-key</code> e non viene salvata nel browser.</span>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">In attesa di un file.</div>
  </section>

  <section id="previewPanel" class="panel" hidden>
    <h2>Anteprima</h2>
    <p id="summary" class="muted"></p>
    <div id="warnings" class="warnings"></div>
    <div id="tableWrap" class="scroll"></div>

    <label class="confirm">
      <input id="confirmation" type="checkbox" />
      Confermo di aver controllato preview, fonte e dataset e autorizzo la scrittura nel database.
    </label>
    <div class="actions">
      <button id="commitBtn" class="danger" disabled>Conferma e importa</button>
    </div>
  </section>
</main>

<script>
  const fileInput = document.getElementById('file');
  const datasetTypeInput = document.getElementById('datasetType');
  const sourceInput = document.getElementById('source');
  const keyInput = document.getElementById('importKey');
  const previewBtn = document.getElementById('previewBtn');
  const commitBtn = document.getElementById('commitBtn');
  const confirmation = document.getElementById('confirmation');
  const statusBox = document.getElementById('status');
  const previewPanel = document.getElementById('previewPanel');
  const summary = document.getElementById('summary');
  const warningsBox = document.getElementById('warnings');
  const tableWrap = document.getElementById('tableWrap');

  let lastPayload = null;
  let lastDigest = null;

  function setStatus(message, kind) {
    statusBox.textContent = message;
    statusBox.className = 'status' + (kind ? ' ' + kind : '');
  }

  function formatFromFile(file) {
    const name = String(file?.name || '').toLowerCase();
    if (name.endsWith('.csv')) return 'csv';
    if (name.endsWith('.json')) return 'json';
    return null;
  }

  function addCell(row, value, tag) {
    const cell = document.createElement(tag || 'td');
    if (value && typeof value === 'object') cell.textContent = JSON.stringify(value);
    else cell.textContent = value == null ? '' : String(value);
    row.appendChild(cell);
  }

  function renderPreview(result) {
    previewPanel.hidden = false;
    summary.textContent = `${result.rowCount} righe · ${result.format.toUpperCase()} · digest ${result.digest}`;
    warningsBox.textContent = result.warnings?.length ? 'Avvisi: ' + result.warnings.join(' | ') : 'Nessun avviso di schema.';
    tableWrap.replaceChildren();

    const fields = Array.isArray(result.schemaFields) ? result.schemaFields : [];
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    fields.forEach((field) => addCell(headRow, field, 'th'));
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    (result.preview || []).forEach((record) => {
      const tr = document.createElement('tr');
      fields.forEach((field) => addCell(tr, record[field]));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }

  async function callImport(endpoint, payload, key) {
    const response = await fetch('/api/data-import/' + endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-import-key': key
      },
      body: JSON.stringify(payload)
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body;
  }

  previewBtn.addEventListener('click', async () => {
    const file = fileInput.files?.[0];
    const datasetType = datasetTypeInput.value.trim();
    const source = sourceInput.value.trim();
    const key = keyInput.value;
    const format = formatFromFile(file);

    if (!file) return setStatus('Seleziona un file CSV o JSON.', 'error');
    if (!format) return setStatus('Formato non supportato. Usa .csv o .json.', 'error');
    if (!datasetType) return setStatus('Inserisci il tipo dataset.', 'error');
    if (!source) return setStatus('Inserisci la fonte del dataset.', 'error');
    if (!key) return setStatus('Inserisci la chiave di import.', 'error');

    previewBtn.disabled = true;
    commitBtn.disabled = true;
    confirmation.checked = false;
    previewPanel.hidden = true;
    setStatus('Analisi in corso…');

    try {
      const data = await file.text();
      const payload = { format, datasetType, source, data, importedBy: 'zorgax-ui' };
      const result = await callImport('preview', payload, key);
      lastPayload = payload;
      lastDigest = result.digest;
      renderPreview(result);
      setStatus('Preview completata. Controlla i dati prima di confermare.', 'ok');
    } catch (error) {
      lastPayload = null;
      lastDigest = null;
      setStatus('Errore: ' + error.message, 'error');
    } finally {
      previewBtn.disabled = false;
    }
  });

  confirmation.addEventListener('change', () => {
    commitBtn.disabled = !(confirmation.checked && lastPayload && lastDigest);
  });

  commitBtn.addEventListener('click', async () => {
    if (!confirmation.checked || !lastPayload || !lastDigest) return;
    const key = keyInput.value;
    if (!key) return setStatus('La chiave di import è richiesta.', 'error');

    commitBtn.disabled = true;
    previewBtn.disabled = true;
    setStatus('Import nel database in corso…');
    try {
      const result = await callImport('commit', {
        ...lastPayload,
        confirmation: true,
        expectedDigest: lastDigest
      }, key);
      setStatus(`Import completato. Batch ${result.importBatchId} · ${result.rowCount} righe.`, 'ok');
      confirmation.checked = false;
      lastPayload = null;
      lastDigest = null;
    } catch (error) {
      setStatus('Errore durante import: ' + error.message, 'error');
      commitBtn.disabled = false;
    } finally {
      previewBtn.disabled = false;
    }
  });
</script>
</body>
</html>
