apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  namespace: myzubster
type: Opaque
stringData:
  MONGODB_URI: mongodb://replace-me:27017/myzubster
  MONERO_RPC_USERNAME: replace-me
  MONERO_RPC_PASSWORD: replace-me
