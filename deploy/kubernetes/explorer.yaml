apiVersion: apps/v1
kind: Deployment
metadata:
  name: monero-explorer
  namespace: myzubster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monero-explorer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monero-explorer
    spec:
      containers:
        - name: explorer
          image: ghcr.io/myzubster-ecosystem/monero-explorer:latest
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monero-explorer
  namespace: myzubster
spec:
  selector:
    app.kubernetes.io/name: monero-explorer
  ports:
    - name: http
      port: 80
      targetPort: http
