apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monero-rpc-data
  namespace: myzubster
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monero-rpc
  namespace: myzubster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monero-rpc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monero-rpc
    spec:
      containers:
        - name: monero-rpc
          image: ghcr.io/myzubster-ecosystem/monero-rpc:latest
          ports:
            - name: rpc
              containerPort: 18081
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec monero-wallet-rpc --rpc-bind-ip=0.0.0.0 --rpc-bind-port=18081
              --wallet-file=/data/wallet
              --rpc-login="${MONERO_RPC_USERNAME}:${MONERO_RPC_PASSWORD}"
          env:
            - name: MONERO_RPC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: MONERO_RPC_USERNAME
            - name: MONERO_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: MONERO_RPC_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: rpc
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: monero-rpc-data
---
apiVersion: v1
kind: Service
metadata:
  name: monero-rpc
  namespace: myzubster
spec:
  selector:
    app.kubernetes.io/name: monero-rpc
  ports:
    - name: rpc
      port: 18081
      targetPort: rpc
