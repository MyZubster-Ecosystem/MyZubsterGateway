<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 Mappa Globale del Passato - Pytho Temporal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 3rem;
            text-align: center;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { text-align: center; opacity: 0.7; margin-bottom: 30px; }
        .era-section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .era-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .era-title .year { color: #a855f7; }
        .era-title .era { color: #ec4899; font-size: 0.9rem; margin-left: 10px; }
        .species-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .species-item {
            background: rgba(255,255,255,0.03);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .species-item .name { font-weight: bold; }
        .species-item .status { font-size: 0.8rem; opacity: 0.6; }
        .location-info {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        .search-box input {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            min-width: 300px;
        }
        .search-box button {
            padding: 10px 25px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .footer {
            text-align: center;
            opacity: 0.4;
            margin-top: 30px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Mappa Globale del Passato</h1>
        <p class="subtitle">🛸 Le piante recuperate da Pytho nel tempo</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cerca una pianta... (es. Rosa)">
            <button onclick="searchPlant()">🔍 Cerca</button>
        </div>

        <div id="mapContainer">
            <div class="loading">⏳ Caricamento mappa...</div>
        </div>

        <div class="footer">👽 Pytho Temporal - La macchina del tempo open source</div>
    </div>

    <script>
        async function loadMap() {
            try {
                const response = await fetch('/api/pytho/global-map');
                const data = await response.json();
                
                if (data.success) {
                    renderMap(data.map);
                }
            } catch (error) {
                document.getElementById('mapContainer').innerHTML = '❌ Errore caricamento mappa';
            }
        }

        function renderMap(mapData) {
            let html = '';
            const years = Object.keys(mapData).sort();
            
            for (const year of years) {
                const locations = mapData[year];
                for (const [location, data] of Object.entries(locations)) {
                    const speciesList = data.species.map(s => 
                        `<div class="species-item">
                            <div class="name">${s}</div>
                            <div class="status">${data.status}</div>
                        </div>`
                    ).join('');

                    html += `
                        <div class="era-section">
                            <div class="era-title">
                                <span class="year">${year}</span>
                                <span class="era">${data.era}</span>
                            </div>
                            <div class="location-info">📍 ${location}</div>
                            <div class="species-grid">${speciesList}</div>
                        </div>
                    `;
                }
            }
            
            document.getElementById('mapContainer').innerHTML = html;
        }

        async function searchPlant() {
            const name = document.getElementById('searchInput').value.trim();
            if (!name) return;
            
            try {
                const response = await fetch(`/api/pytho/search-plant/${encodeURIComponent(name)}`);
                const data = await response.json();
                
                if (data.success && data.found.length > 0) {
                    let html = `<h2>🔍 Risultati per "${name}"</h2>`;
                    for (const result of data.found) {
                        html += `
                            <div class="era-section">
                                <div class="era-title">
                                    <span class="year">${result.year}</span>
                                </div>
                                <div class="location-info">📍 ${result.location}</div>
                                <div class="species-grid">
                                    ${result.species.map(s => 
                                        `<div class="species-item"><div class="name">${s}</div></div>`
                                    ).join('')}
                                </div>
                            </div>
                        `;
                    }
                    document.getElementById('mapContainer').innerHTML = html;
                } else {
                    document.getElementById('mapContainer').innerHTML = `
                        <div style="text-align:center;opacity:0.6;">
                            🌿 Nessuna pianta trovata per "${name}"<br>
                            <button onclick="loadMap()" style="margin-top:10px;padding:10px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;cursor:pointer;">↩️ Torna alla mappa</button>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('mapContainer').innerHTML = '❌ Errore ricerca';
            }
        }

        // Carica la mappa all'avvio
        loadMap();
    </script>
</body>
</html>
