<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">MyZubster Gateway settlement verification flow</title><desc id="desc">Documentation diagram separating MyZubster core, Gateway adapters, external payment provider, independent verifier and final confirmed state.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#160922"/></linearGradient></defs><rect width="1600" height="760" rx="32" fill="url(#bg)"/><g font-family="Inter,Arial,sans-serif"><text x="70" y="82" font-size="44" font-weight="700" fill="#f4fbff">MYZUBSTER // GATEWAY VERIFICATION FLOW</text><text x="70" y="120" font-size="19" fill="#54edff">INTEGRATION BOUNDARY · FAIL CLOSED · INDEPENDENT VERIFICATION</text><g fill="#0d2032" stroke="#45eaff" stroke-width="3"><rect x="60" y="210" width="250" height="120" rx="18"/><rect x="380" y="210" width="250" height="120" rx="18"/><rect x="700" y="210" width="250" height="120" rx="18"/><rect x="1020" y="210" width="250" height="120" rx="18"/><rect x="1340" y="210" width="200" height="120" rx="18"/></g><g fill="#fff" text-anchor="middle" font-size="22" font-weight="700"><text x="185" y="260">MYZUBSTER CORE</text><text x="505" y="260">GATEWAY</text><text x="825" y="260">PROVIDER</text><text x="1145" y="260">VERIFIER</text><text x="1440" y="260">FINAL STATE</text></g><g fill="#9ed6de" text-anchor="middle" font-size="16"><text x="185" y="292">expected settlement</text><text x="505" y="292">API · adapters · idempotency</text><text x="825" y="292">payment / treasury rail</text><text x="1145" y="292">recipient · amount · network</text><text x="1440" y="292">CONFIRMED / PAID</text></g><g stroke="#ff4de1" stroke-width="4" fill="#ff4de1"><path d="M310 270H380"/><path d="M630 270H700"/><path d="M950 270H1020"/><path d="M1270 270H1340"/></g><rect x="170" y="430" width="1260" height="190" rx="24" fill="#160d22" stroke="#ff4de1" stroke-width="3"/><text x="800" y="480" text-anchor="middle" font-size="24" font-weight="700" fill="#ff75eb">SETTLEMENT CONTRACT</text><text x="800" y="525" text-anchor="middle" font-size="20" fill="#fff">PENDING → RESERVED / ACCEPTED → SUBMITTED → CONFIRMED → PAID</text><text x="800" y="565" text-anchor="middle" font-size="17" fill="#b6d3d9">Provider response alone ≠ proof. Database state ≠ chain/payment proof. Verification unavailable → do not infer success.</text><text x="800" y="600" text-anchor="middle" font-size="17" fill="#b6d3d9">Failure states may include FAILED · UNSETTLED · DISPUTED · CANCELLED.</text><text x="800" y="700" text-anchor="middle" font-size="17" fill="#54edff">DOCUMENTATION_VISUAL · Source: current MyZubsterGateway README · 2026-08-22</text></g></svg>