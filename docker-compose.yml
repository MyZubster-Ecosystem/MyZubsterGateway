version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: myzubster-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: myzubster
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myzubster-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-10000}:10000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 10000
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/myzubster?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-10000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TARI_WALLET_URL: ${TARI_WALLET_URL:-http://tari-wallet:12000}
      MONERO_WALLET_URL: ${MONERO_WALLET_URL:-http://monero-wallet:18082}
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file:
      - .env

  tari-wallet:
    image: tariproject/wallet:latest
    container_name: myzubster-tari-wallet
    restart: unless-stopped
    ports:
      - "${TARI_WALLET_PORT:-12000}:12000"
    environment:
      TARI_NETWORK: ${TARI_NETWORK:-esmeralda}
    volumes:
      - tari_wallet_data:/home/tari/.tari
    networks:
      - myzubster-network
    profiles:
      - full

  monero-wallet:
    image: monero-wallet-rpc:latest
    container_name: myzubster-monero-wallet
    restart: unless-stopped
    ports:
      - "${MONERO_WALLET_PORT:-18082}:18082"
    environment:
      MONERO_DAEMON_ADDRESS: ${MONERO_DAEMON:-stagenet.community.rino.io:38081}
    volumes:
      - monero_wallet_data:/home/monero
    networks:
      - myzubster-network
    profiles:
      - full

volumes:
  mongodb_data:
    driver: local
  tari_wallet_data:
    driver: local
  monero_wallet_data:
    driver: local

networks:
  myzubster-network:
    driver: bridge
