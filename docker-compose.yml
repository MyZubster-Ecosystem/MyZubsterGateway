version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: myzubster-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: myzubster
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myzubster-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-10000}:10000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 10000
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/myzubster?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GATEWAY_PORT: ${GATEWAY_PORT:-10000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    env_file:
      - .env
    # Uncomment for development with volume mount
    # volumes:
    #   - ./:/app
    #   - /app/node_modules

volumes:
  mongodb_data:
    driver: local

networks:
  myzubster-network:
    driver: bridge
