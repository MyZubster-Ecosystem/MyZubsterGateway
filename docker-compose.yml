version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: myzubster-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
      MONGO_INITDB_DATABASE: myzubster
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tari-wallet-stub:
    build:
      context: ./gateway
      dockerfile: Dockerfile.tari-stub
    container_name: myzubster-tari-wallet
    restart: unless-stopped
    ports:
      - "${TARI_WALLET_PORT:-12021}:12021"
    environment:
      WALLET_ADDRESS: ${TARI_WALLET_ADDRESS:-12Nbmmm5g5pDmJKNTJsHycQoLhYLoAitU4}
      RPC_PORT: 12021
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:12021/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  monero-wallet-stub:
    build:
      context: ./gateway
      dockerfile: Dockerfile.xmr-stub
    container_name: myzubster-monero-wallet
    restart: unless-stopped
    ports:
      - "${XMR_WALLET_PORT:-18082}:18082"
    environment:
      WALLET_ADDRESS: ${XMR_WALLET_ADDRESS:-}
      RPC_PORT: 18082
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18082/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myzubster-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-10000}:10000"
    depends_on:
      mongodb:
        condition: service_healthy
      tari-wallet-stub:
        condition: service_healthy
      monero-wallet-stub:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 10000
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/myzubster?authSource=admin
      TARI_WALLET_RPC: http://tari-wallet-stub:12021
      XMR_WALLET_RPC: http://monero-wallet-stub:18082
      JWT_SECRET: ${JWT_SECRET:-change-me}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - myzubster-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:10000/api/health', r => process.exit(r.statusCode===200?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  myzubster-network:
    driver: bridge

volumes:
  mongodb_data:
