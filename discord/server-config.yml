# MyZubster Discord Server Configuration
# Canali e struttura del server

server:
  name: "MyZubster Gateway"
  icon: "https://github.com/MyZubster-Ecosystem.png"
  region: "europe"

categories:
  - name: "INFORMAZIONI"
    channels:
      - name: "benvenuto"
        type: text
        topic: "Benvenuto nel server MyZubster! Presentati alla community."
        permissions:
          "@everyone": ["VIEW_CHANNEL", "READ_MESSAGE_HISTORY"]
          "Community": ["SEND_MESSAGES", "ADD_REACTIONS"]
      - name: "regole"
        type: text
        topic: "Regole del server - leggere prima di partecipare."
        permissions:
          "@everyone": ["VIEW_CHANNEL", "READ_MESSAGE_HISTORY"]
      - name: "annunci"
        type: text
        topic: "Annunci ufficiali, nuove bounty, merge, aggiornamenti."
        permissions:
          "@everyone": ["VIEW_CHANNEL", "READ_MESSAGE_HISTORY"]
          "Moderator": ["SEND_MESSAGES"]
          "Admin": ["SEND_MESSAGES"]

  - name: "COMMUNITY"
    channels:
      - name: "generale"
        type: text
        topic: "Chat generale - discutere di sviluppo, bounty, feedback."
      - name: "bounty"
        type: text
        topic: "Nuove bounty disponibili! Condividi link e progressi."
      - name: "dev-help"
        type: text
        topic: "Aiuto sviluppo: chiedi supporto su codice, PR, CI."
      - name: "showcase"
        type: text
        topic: "Mostra i tuoi progetti, PR, contributi open source."
      - name: "voice-chat"
        type: voice
        topic: "Voice chat per discussioni e pairing."

  - name: "EVENTI"
    channels:
      - name: "eventi"
        type: text
        topic: "Annunci e organizzazione eventi settimanali."
      - name: "event-voice"
        type: voice
        topic: "Canale vocale per eventi live."

roles:
  - name: "Admin"
    color: "#E74C3C"
    permissions: ["ADMINISTRATOR"]
    hoist: true
  - name: "Moderator"
    color: "#3498DB"
    permissions: ["KICK_MEMBERS", "BAN_MEMBERS", "MANAGE_MESSAGES", "MUTE_MEMBERS"]
    hoist: true
  - name: "Developer"
    color: "#2ECC71"
    permissions: []
    hoist: true
  - name: "Bounty Hunter"
    color: "#F39C12"
    permissions: []
    hoist: true
  - name: "Community"
    color: "#9B59B6"
    permissions: []
    hoist: false
